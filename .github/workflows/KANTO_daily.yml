name: "Daily KANTO Trigger and Update"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "5 0 * * *"
      timezone: 'Asia/Tokyo'

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: "Trigger XREA API"
        run: |
          TS=$(date +%s)
          SECRET=${{ secrets.XREA_SECRET }}
          SIG=$(echo -n "$TS+$SECRET" | sha256sum | awk '{print $1}')
          curl -s "${{ secrets.XREA_URL }}?ts=$TS&sig=$SIG" > /dev/null &
          echo "XREA_PID=$!" >> $GITHUB_ENV

      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: "Install dependencies"
        run: npm install node-fetch iconv-lite fast-xml-parser

      - name: "Run News script"
        run: node js/newsNode.js

      - name: "Wait XREA API and Trigger InLand PHP"
        run: |
          while ps -p ${{ env.XREA_PID }} > /dev/null 2>&1; do
            sleep 1
          done
          echo "XREA API completed!"
          curl -sS https://turiiko.shop/actions/inLandwhether.php > /dev/null &

      - name: "Commit and Push"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/news.json
          git diff --cached --quiet || git commit -m "update news json"
          git push origin main
          
      # 🌟 ここにあった「Upload Artifact」と「Deploy to GitHub Pages」を削除しました。
      # GitHubの設定を変えなくても、上の「git push」が行われた瞬間に
      # 裏側のBotが勝手に1回だけ安全にデプロイしてくれます。
