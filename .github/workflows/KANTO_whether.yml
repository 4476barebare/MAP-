name: Coastal Area Weather Control

on:
  workflow_dispatch:
  schedule:
    - cron: '19 0 * * *'
      timezone: 'Asia/Tokyo' # 1日1回自動実行（JST 01:30 相当）

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Coastal Area Control
        run: |
          node js/coastalArea_control.js KANTO "https://turiiko.shop/actions/data/KANTO_load.json"

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          
          if ! git diff --cached --quiet; then
            git commit -m "🤖 auto: [coastalArea] 天気コントロール処理の更新を反映"
            
            git fetch origin main
            git pull --rebase origin main -X ours
            git push origin HEAD:main
          else
            echo "✅ データに変更がなかったためコミットをスキップしました。"
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment 
        uses: actions/deploy-pages@v4
