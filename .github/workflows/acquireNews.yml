name: "acquire News and Map JSON from XREA"

on:
  workflow_dispatch:
  schedule:
    - cron: '29 13 * * *'
      timezone: 'Asia/Tokyo' # 🌟 日本時間の 01:29 と 13:29 に正確に発火します

# 🌟 デプロイの渋滞や衝突を防ぐ安全装置
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    
    # 🌟 GitHub Pagesへのデプロイ権限を証明するために必須の記述
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # リベース時のエラー防止のために全履歴を取得

      # ========================================================
      # 1. XREAサーバーから最新の各種JSONをダウンロード
      # ========================================================
      - name: "Download JSON data"
        run: |
          mkdir -p data
          
          # ① ニュースデータの取得
          curl -sS "https://turiiko.shop/actions/data/news.json?t=$(date +%s)" -o data/news.json
          
          # ② ★ マップ＆釣果ブログの結合データをエクスポートAPIから取得（ファイル名を compiled_data.json として保存）
          # ※ 注意: 以下のURLパス (`agltest/export.php` の部分) は、実際にAPIのPHPファイルを置いた場所に合わせて修正してください
          curl -sS "https://turiiko.shop/agltest/export.php?key=kR7xQm2Zt9WbLp4NvY8dshoko&t=$(date +%s)" -o data/compiled_data.json

      # ========================================================
      # 2. 取得したデータをリポジトリに保存する処理
      # ========================================================
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # ダウンロードしたJSONを両方ステージング
          git add data/news.json
          git add data/compiled_data.json
          
          # 変更がある場合のみコミットしてプッシュ
          if ! git diff --cached --quiet; then
            git commit -m "🤖 auto: XREAから最新のnewsと釣果データを取得"
            
            # リモートで別の更新があっても衝突しないようリベース
            git pull --rebase origin main
            
            git push origin main
          else
            echo "✅ データに変更がなかったためコミットをスキップしました。"
          fi

      # ========================================================
      # 3. GitHub Pages への直接デプロイ
      # ========================================================
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment 
        uses: actions/deploy-pages@v4
