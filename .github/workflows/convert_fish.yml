name: Manual CSV to JSON Converter

on:
  workflow_dispatch:
    inputs:
      input_csv:
        description: '入力するCSVファイル名 (例: data/IBARAKI_fish.csv)'
        required: true
        default: 'KANTO/○○_fish.csv'
      output_json:
        description: '出力するJSONファイル名 (例: json/IBARAKI_fish.json)'
        required: true
        default: 'KANTO/IBARAKI_fish.json'

permissions:
  contents: write # 変換したJSONをリポジトリに保存するために必要

jobs:
  convert-data:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.jsのセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 変換スクリプトの実行 (引数としてinputとoutputを渡す)
      - name: Run Converter Script
        run: node script/convert_fish.js "${{ github.event.inputs.input_csv }}" "${{ github.event.inputs.output_json }}"

      # 4. 変更があればコミット＆プッシュ
      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.output_json }}"
          
          # 変更がある場合のみコミット
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-converted: ${{ github.event.inputs.input_csv }} to JSON"
          git push
