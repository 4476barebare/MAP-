name: Extract Maps Takeout Data

# 手動実行（workflow_dispatch）をトリガーにする
on:
  workflow_dispatch:
    inputs:
      input_file:
        description: '処理するCSVファイル名 (例: 釣具屋さん_2.csv)'
        required: true
        type: string
      output_file:
        description: '出力するCSVファイル名 (例: output_shops.csv)'
        required: true
        default: 'processed_shops.csv'
        type: string

# 自動コミットのための権限設定
permissions:
  contents: write

jobs:
  extract-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抽出スクリプトを実行
        # 入力ファイルと出力ファイルを引数として渡す
        run: node script/extract_urls.mjs "${{ github.event.inputs.input_file }}" "${{ github.event.inputs.output_file }}"

      - name: 抽出結果をコミット＆プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/${{ github.event.inputs.output_file }}
          # 変更がなければエラーにならないようにする
          git commit -m "Auto-extract: Maps takeout data to ${{ github.event.inputs.output_file }}" || echo "No changes to commit"
          git push
