name: Fetch Newslist from Google Drive

on:
  schedule:
    # 毎日 日本時間 19:00 (UTC 10:00) に実行（※時間は自由に変更可能です）
    - cron: '0 10 * * *'
  workflow_dispatch: # 手動でのテスト実行ボタン

permissions:
  contents: write

jobs:
  fetch-newslist:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch newslist.json from GAS
        env:
          GAS_URL: ${{ secrets.DRIVE_FETCHER_GAS_URL }}
          SECRET_KEY: "aZ3kP9xQw7LmN2vB8tRc"
          FOLDER_NAME: "Muse"
          FILE_NAME: "newslist.json"
        run: |
          # GASのURLにパラメータを付与して叩く（-Lでリダイレクト追跡）
          TARGET_URL="${GAS_URL}?folder=${FOLDER_NAME}&file=${FILE_NAME}&key=${SECRET_KEY}"
          
          curl -sSL "$TARGET_URL" -o downloaded_news.json
          
          # 正しいJSONであるか、GASからのエラーメッセージが返ってきていないかを検証
          STATUS=$(jq -r '.status // empty' downloaded_news.json)
          if [ "$STATUS" == "error" ]; then
            echo "Error fetching file:"
            cat downloaded_news.json
            exit 1
          fi
          
          # 破損ファイルでないかパースチェック
          jq . downloaded_news.json > /dev/null
          
          # 検証を通過したら本番ファイルとして配置（※保存先パスは必要に応じて変更してください）
          mv downloaded_news.json newslist.json
          echo "Successfully fetched and verified newslist.json"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add /data/newslist.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update newslist.json from Google Drive"
            git push
          fi
