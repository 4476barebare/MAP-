name: Fetch Approved Temp Pins

on:
  schedule:
    # 毎日 日本時間 4:30 (UTC 19:30) に実行
    - cron: '30 19 * * *'
  workflow_dispatch: # 手動でのテスト実行ボタンも有効化

permissions:
  contents: write

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch approved pins from GAS
        env:
          GAS_URL: ${{ secrets.TEMP_PIN_GAS_URL }}
          SECRET_KEY: "aZ3kP9xQw7LmN2vB8tRc"
        run: |
          mkdir -p KANTO
          TARGET_FILE="KANTO/user_pins.json"

          # 1. GASから本採用データを取得（リダイレクト追跡 -L）
          curl -sSL "${GAS_URL}?action=export_approved&key=${SECRET_KEY}" -o /tmp/response.json

          # 2. レスポンスの検証
          STATUS=$(jq -r '.status' /tmp/response.json)
          if [ "$STATUS" != "ok" ]; then
            echo "Error: Failed to fetch approved pins. Response:"
            cat /tmp/response.json
            exit 1
          fi

          # 3. approved配列を抽出
          jq '.approved' /tmp/response.json > /tmp/new_pins.json
          NEW_COUNT=$(jq 'length' /tmp/new_pins.json)
          echo "Fetched $NEW_COUNT approved pins."

          # 4. 本採用が0件の日はここで終了（コミットしない）
          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "No new approved pins today."
            exit 0
          fi

          # 5. KANTO/user_pins.json がまだ無ければ空配列で初期化
          if [ ! -f "$TARGET_FILE" ]; then
            echo "[]" > "$TARGET_FILE"
          fi

          # 6. 既存の KANTO/user_pins.json と新規取得分を結合（重複IDは除外）
          jq -s '.[0] + .[1] | unique_by(.id)' "$TARGET_FILE" /tmp/new_pins.json > /tmp/merged.json
          mv /tmp/merged.json "$TARGET_FILE"
          echo "Merged successfully. Total pins in $TARGET_FILE: $(jq 'length' "$TARGET_FILE")"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KANTO/user_pins.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update KANTO/user_pins.json"
            git push
          fi
