name: "acquire News JSON from GAS"

on:
  workflow_dispatch:
  schedule:
    - cron: '29 13 * * *'
      timezone: 'Asia/Tokyo'

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GASからニュースリストだけを取得
      - name: "Download newslist.json"
        env:
          GAS_URL: ${{ secrets.DRIVE_FETCHER_GAS_URL }}
          SECRET_KEY: "aZ3kP9xQw7LmN2vB8tRc"
          FOLDER_NAME: "Muse"
          FILE_NAME: "newslist.json"
        run: |
          mkdir -p data
          TARGET_URL="${GAS_URL}?folder=${FOLDER_NAME}&file=${FILE_NAME}&key=${SECRET_KEY}"
          curl -sSL --fail "$TARGET_URL" -o /tmp/downloaded_news.json

          STATUS=$(jq -r '.status // empty' /tmp/downloaded_news.json)
          if [ "$STATUS" = "error" ]; then
            echo "Error fetching newslist.json from GAS:"
            cat /tmp/downloaded_news.json
            exit 1
          fi

          jq -e . /tmp/downloaded_news.json > /dev/null
          mv /tmp/downloaded_news.json data/newslist.json
          echo "✅ data/newslist.json の取得・検証完了"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/newslist.json

          if ! git diff --cached --quiet; then
            git commit -m "🤖 auto: 最新のニュース(newslist.json)を更新"
            git pull --rebase origin main
            git push origin main
          else
            echo "✅ ニュースデータに変更がなかったためコミットをスキップしました。"
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
