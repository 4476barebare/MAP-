name: Generate Pref Spot AI Markdown

on:
  push:
    branches:
      - main
    paths:
      - "KANTO/*_location.json"
      - "KANTO/*_fish.json"
      - "KANTO/*_dictionary.json"
      - "KANTO/*_shop.json"
      - "data/KANTO_geo.json"
      - "script/generate_pref_md.js"
  workflow_dispatch:
    inputs:
      pref_code:
        description: "生成対象の都道府県を選択（ALLで全県一括生成）"
        required: true
        default: "CHIBA"
        type: choice
        options:
          - CHIBA
          - TOKYO
          - KANAGAWA
          - IBARAKI
          - SAITAMA
          - GUNMA
          - ALL
      custom_prefs:
        description: "複数県を指定したい場合のみ入力（例: CHIBA,TOKYO / 空欄なら上の選択を使用）"
        required: false
        default: ""
        type: string
      region_code:
        description: "対象リージョンコード"
        required: true
        default: "KANTO"
        type: string

concurrency:
  group: "ai-data-pref-md"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-pref-md:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve target prefectures
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PREF: ${{ inputs.pref_code }}
          INPUT_CUSTOM: ${{ inputs.custom_prefs }}
          INPUT_REGION: ${{ inputs.region_code }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          REGION="${INPUT_REGION:-KANTO}"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_CUSTOM}" ]; then
              PREFS="${INPUT_CUSTOM}"
            else
              PREFS="${INPUT_PREF:-CHIBA}"
            fi
          else
            # pushイベント時は変更されたファイルから対象県を自動抽出
            if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              PREFS="ALL"
            else
              CHANGED=$(git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" || true)
              if echo "${CHANGED}" | grep -Eq '^(data/KANTO_geo\.json|script/generate_pref_md\.js)$'; then
                PREFS="ALL"
              else
                PREFS=$(echo "${CHANGED}" \
                  | grep -E "^${REGION}/[A-Za-z0-9-]+_(location|fish|dictionary|shop)\.json$" \
                  | sed -E "s|^${REGION}/([A-Za-z0-9-]+)_(location|fish|dictionary|shop)\.json$|\1|" \
                  | tr '[:lower:]' '[:upper:]' \
                  | sort -u \
                  | paste -sd ',' -)
                if [ -z "${PREFS}" ]; then
                  PREFS="ALL"
                fi
              fi
            fi
          fi

          echo "prefs=${PREFS}" >> "${GITHUB_OUTPUT}"
          echo "region=${REGION}" >> "${GITHUB_OUTPUT}"
          echo "Target Prefs : ${PREFS}"
          echo "Target Region: ${REGION}"

      - name: Generate Pref Spot Markdown files
        env:
          TARGET_PREFS: ${{ steps.target.outputs.prefs }}
          TARGET_REGION: ${{ steps.target.outputs.region }}
        run: |
          node script/generate_pref_md.js "${TARGET_PREFS}" "${TARGET_REGION}"

      - name: Commit and push generated Markdown
        env:
          TARGET_PREFS: ${{ steps.target.outputs.prefs }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- 'ai-data/*.md' ':!ai-data/*_catch.md'

          if git diff --cached --quiet; then
            echo "スポット関連のAI用Markdownに変更はありません。"
          else
            git commit -m "auto: Generate pref spot AI Markdown (${TARGET_PREFS})"
            git pull --rebase --autostash origin main
            git push origin main
          fi
