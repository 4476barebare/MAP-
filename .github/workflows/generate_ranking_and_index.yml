name: Generate Tomorrow Ranking & Static HTML

on:
  push:
    branches:
      - main
    paths:
      - "template/index.txt"
      - "script/generate_ranking_and_index.js"
  workflow_dispatch:
    inputs:
      output_html:
        description: "生成するHTMLファイル名（本番: index.html / テスト: index2.html）"
        required: true
        default: "index.html"
        type: string
      region_code:
        description: "対象リージョンコード"
        required: true
        default: "KANTO"
        type: string
  workflow_call:
    inputs:
      output_html:
        required: false
        default: "index.html"
        type: string
      region_code:
        required: false
        default: "KANTO"
        type: string

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-ranking-html:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate Ranking Cache, Tomorrow MD, Lightweight HTMLs and Index HTML
        env:
          TARGET_REGION: ${{ inputs.region_code || 'KANTO' }}
          OUTPUT_HTML: ${{ inputs.output_html || 'index.html' }}
          TEMPLATE_PATH: "template/index.txt"
        run: |
          echo "Region     : ${TARGET_REGION}"
          echo "Template   : ${TEMPLATE_PATH}"
          echo "Output HTML: ${OUTPUT_HTML}"
          node script/generate_ranking_and_index.js "${TARGET_REGION}" "${OUTPUT_HTML}"

      - name: Refresh llms.txt if generator exists
        env:
          TARGET_REGION: ${{ inputs.region_code || 'KANTO' }}
        run: |
          if [ -f "script/generate_pref_md.js" ]; then
            node script/generate_pref_md.js LLMS "${TARGET_REGION}"
          fi

      - name: Commit and push generated files
        id: commit
        env:
          TARGET_REGION: ${{ inputs.region_code || 'KANTO' }}
          OUTPUT_HTML: ${{ inputs.output_html || 'index.html' }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "${OUTPUT_HTML}" "ai-data/ranking_cache.json" "ai-data/${TARGET_REGION}_tomorrow.md"
          if compgen -G "ai-data/*.html" > /dev/null; then
            git add -- ai-data/*.html
          fi
          if [ -f "llms.txt" ]; then
            git add -- llms.txt
          fi

          if git diff --cached --quiet; then
            echo "ランキング・静的HTMLに変更はありません。"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "auto: Generate tomorrow ranking, lightweight HTMLs and ${OUTPUT_HTML}"
            git pull --rebase --autostash origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages Artifact
        if: steps.commit.outputs.pushed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.commit.outputs.pushed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
