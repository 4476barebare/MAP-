name: "acquire fishJSON from XREA"

on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * *' # JST 13:29 (UTC 04:29)

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # XREAからcompiled_data.jsonを取得し、JSONとして検証
      - name: "Download and Verify compiled_data.json"
        env:
          XREA_EXPORT_KEY: ${{ secrets.XREA_EXPORT_KEY }}
        run: |
          mkdir -p data

          if [ -z "$XREA_EXPORT_KEY" ]; then
            echo "❌ GitHub Actions Secret XREA_EXPORT_KEY が設定されていません。"
            exit 1
          fi

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          URL="https://turiiko.shop/agltest/export_map_data.php?key=${XREA_EXPORT_KEY}&t=$(date +%s)"
          TMP_FILE="/tmp/compiled_data.json.tmp"
          DEST="data/compiled_data.json"

          echo "Fetching compiled_data.json from XREA..."
          HTTP_CODE=$(curl -sSL -w "%{http_code}" -A "$UA" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: ja,en-US;q=0.9,en;q=0.8" \
            --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 60 \
            "$URL" -o "$TMP_FILE")

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ HTTPエラー ($HTTP_CODE)。XREAのWAFやアクセス制限の可能性があります。"
            head -n 20 "$TMP_FILE" || true
            exit 1
          fi

          if ! jq -e . "$TMP_FILE" > /dev/null 2>&1; then
            echo "❌ 取得データが有効なJSONではありません。既存ファイルは上書きしません。"
            head -n 20 "$TMP_FILE" || true
            exit 1
          fi

          mv "$TMP_FILE" "$DEST"
          echo "✅ $(wc -c < "$DEST") bytes"

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/compiled_data.json

          if ! git diff --cached --quiet; then
            git commit -m "🤖 auto: 最新の釣果データ(compiled_data.json)を更新"
            git pull --rebase origin main
            git push origin main
          else
            echo "✅ データに変更がなかったためコミットをスキップしました。"
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
