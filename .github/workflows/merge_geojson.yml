name: Merge and Convert GeoJSON

on:
  workflow_dispatch:
    inputs:
      input_file_1:
        description: '結合するGeoJSONファイル1 (例: json/TOKYO_jr.geojson)'
        required: true
        default: 'json/TOKYO1.json'
      input_file_2:
        description: '結合するGeoJSONファイル2 (例: json/TOKYO_private.geojson)'
        required: true
        default: 'json/TOKYO2.json'
      output_file:
        description: '出力するJSONファイルパス (例: json/TOKYO.json)'
        required: true
        default: 'json/TOKYO4.json'

jobs:
  merge_and_convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの書き込み権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run merge script
        run: |
          node script/merge_convert.js "${{ github.event.inputs.input_file_1 }}" "${{ github.event.inputs.input_file_2 }}" "${{ github.event.inputs.output_file }}"

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "${{ github.event.inputs.output_file }}"
          git commit -m "Auto-merge and convert: ${{ github.event.inputs.input_file_1 }} & ${{ github.event.inputs.input_file_2 }}" || echo "No changes to commit"
          git push
