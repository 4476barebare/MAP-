name: "Morning Data Sync & Static Build (06:00 JST)"

on:
  # GitHub Actions の cron 遅延対策のため schedule は廃止し、
  # cron-job.org から workflow_dispatch で起動する構成へ一本化
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "変更がなくても GitHub Pages へ強制デプロイする"
        required: false
        default: false
        type: boolean

# デプロイ渋滞・Git競合を防ぐ排他制御（夕方・手動ビルドと同一グループで直列化）
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  morning-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Summary Table
        run: |
          echo "### 🌅 朝のデータ同期＆静的ビルド 実行結果 (JST 06:00)" >> "$GITHUB_STEP_SUMMARY"
          echo "| 対象処理 | 保存先 | ステータス | 詳細 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"

      # ========================================================
      # 1. 天気v2 & 潮汐ポリラインv2 JSONの回収 (汎用GAS: Weather folder -> data/)
      #    ※同一ジョブ内の後続ステップはプッシュを待たずこの最新ファイルを直接参照する
      # ========================================================
      - name: "1. Fetch Weather v2 and Tide v2 JSONs (GAS: Weather folder)"
        continue-on-error: true
        env:
          GAS_URL: ${{ secrets.DRIVE_FETCHER_GAS_URL }}
          SECRET_KEY: "aZ3kP9xQw7LmN2vB8tRc"
          FOLDER_NAME: "Weather"
          REGION_CSV: "KANTO/KANTO_region.csv"
        run: |
          mkdir -p data

          if [ ! -f "$REGION_CSV" ]; then
            echo "❌ エラー: $REGION_CSV が見つかりません。"
            echo "| 1. 天気・潮汐JSON v2 | \`data/*_weather_v2.json / _tide_v2.json\` | ❌ 失敗 | KANTO_region.csv 未検出 |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          PREFS=$(awk -F',' 'NR>1 {gsub(/\r/, "", $0); if ($11 == "pref") print $1}' "$REGION_CSV")
          if [ -z "$PREFS" ]; then
            echo "❌ エラー: $REGION_CSV から pref 行を抽出できませんでした。"
            echo "| 1. 天気・潮汐JSON v2 | \`data/*_weather_v2.json / _tide_v2.json\` | ❌ 失敗 | pref行なし |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          UPDATED_FILES=0
          SKIPPED_FILES=0
          FAILED_PREFS=""

          for PREF in $PREFS; do
            echo "========================================="
            echo "📥 Fetching v2 weather & tide data for [$PREF] ..."
            echo "========================================="

            # 1-A. 天気v2 (${PREF}_weather_v2.json : 沿岸・内陸統合)
            WEATHER_FILE="${PREF}_weather_v2.json"
            WEATHER_DEST="data/${WEATHER_FILE}"
            WEATHER_TMP="/tmp/${WEATHER_FILE}"
            WEATHER_URL="${GAS_URL}?folder=${FOLDER_NAME}&file=${WEATHER_FILE}&key=${SECRET_KEY}"

            if curl -sSL --fail --retry 2 --connect-timeout 15 --max-time 60 "$WEATHER_URL" -o "$WEATHER_TMP" \
              && jq -e '.date != null and (.spots | type == "object") and ((.spots | length) > 0)' "$WEATHER_TMP" > /dev/null 2>&1; then
              if [ -f "$WEATHER_DEST" ] && cmp -s "$WEATHER_TMP" "$WEATHER_DEST"; then
                SKIPPED_FILES=$((SKIPPED_FILES + 1))
                echo "  ⏭️ Unchanged: $WEATHER_DEST"
              else
                mv "$WEATHER_TMP" "$WEATHER_DEST"
                UPDATED_FILES=$((UPDATED_FILES + 1))
                SPOT_CNT=$(jq '.spots | length' "$WEATHER_DEST")
                FILE_DATE=$(jq -r '.date' "$WEATHER_DEST")
                echo "  ✅ Saved $WEATHER_DEST (date: ${FILE_DATE}, ${SPOT_CNT} spots)"
              fi
            else
              echo "  ❌ Error: Invalid JSON for ${WEATHER_FILE}"
              head -n 10 "$WEATHER_TMP" 2>/dev/null || true
              FAILED_PREFS="${FAILED_PREFS} ${PREF}(weather_v2)"
            fi

            sleep 1

            # 1-B. 潮汐ポリラインv2 (${PREF}_tide_v2.json : 沿岸スポット8日分1Dポリライン)
            TIDE_FILE="${PREF}_tide_v2.json"
            TIDE_DEST="data/${TIDE_FILE}"
            TIDE_TMP="/tmp/${TIDE_FILE}"
            TIDE_URL="${GAS_URL}?folder=${FOLDER_NAME}&file=${TIDE_FILE}&key=${SECRET_KEY}"

            if curl -sSL --fail --retry 2 --connect-timeout 15 --max-time 60 "$TIDE_URL" -o "$TIDE_TMP" \
              && jq -e '.date != null and (.spots | type == "object") and ((.spots | length) > 0)' "$TIDE_TMP" > /dev/null 2>&1; then
              if [ -f "$TIDE_DEST" ] && cmp -s "$TIDE_TMP" "$TIDE_DEST"; then
                SKIPPED_FILES=$((SKIPPED_FILES + 1))
                echo "  ⏭️ Unchanged: $TIDE_DEST"
              else
                mv "$TIDE_TMP" "$TIDE_DEST"
                UPDATED_FILES=$((UPDATED_FILES + 1))
                SPOT_CNT=$(jq '.spots | length' "$TIDE_DEST")
                FILE_DATE=$(jq -r '.date' "$TIDE_DEST")
                echo "  ✅ Saved $TIDE_DEST (date: ${FILE_DATE}, ${SPOT_CNT} spots)"
              fi
            else
              echo "  ❌ Error: Invalid JSON for ${TIDE_FILE}"
              head -n 10 "$TIDE_TMP" 2>/dev/null || true
              FAILED_PREFS="${FAILED_PREFS} ${PREF}(tide_v2)"
            fi

            sleep 1
          done

          if [ -n "$FAILED_PREFS" ]; then
            echo "| 1. 天気・潮汐JSON v2 | \`data/*_weather_v2.json / _tide_v2.json\` | ⚠️ 一部失敗 | 更新 ${UPDATED_FILES} / 変化なし ${SKIPPED_FILES} / 失敗:${FAILED_PREFS} |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [ "$UPDATED_FILES" -eq 0 ]; then
            echo "| 1. 天気・潮汐JSON v2 | \`data/*_weather_v2.json / _tide_v2.json\` | ⏭️ 更新なし | 全 ${SKIPPED_FILES}ファイル変更なし |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 1. 天気・潮汐JSON v2 | \`data/*_weather_v2.json / _tide_v2.json\` | ✅ 更新完了 | 更新 ${UPDATED_FILES} / 変化なし ${SKIPPED_FILES} |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # 2. 本採用ピンの回収 (専用GAS)
      # ========================================================
      - name: "2. Fetch Approved Pins (GAS)"
        continue-on-error: true
        env:
          GAS_URL: ${{ secrets.TEMP_PIN_GAS_URL }}
          SECRET_KEY: "aZ3kP9xQw7LmN2vB8tRc"
        run: |
          mkdir -p KANTO
          TARGET_FILE="KANTO/user_pins.json"
          TMP_RES="/tmp/pins_response.json"

          if ! curl -sSL --fail --retry 2 --connect-timeout 15 --max-time 45 \
            "${GAS_URL}?action=export_approved&key=${SECRET_KEY}" -o "$TMP_RES"; then
            echo "❌ [Approved Pins] GAS通信に失敗しました"
            echo "| 2. 本採用ピン | \`KANTO/user_pins.json\` | ❌ 失敗 | GAS通信エラー |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          STATUS=$(jq -r 'if type == "object" then .status // empty else empty end' "$TMP_RES" 2>/dev/null || echo "invalid")
          if [ "$STATUS" != "ok" ]; then
            echo "❌ [Approved Pins] レスポンス検証エラー"
            head -n 5 "$TMP_RES" || true
            echo "| 2. 本採用ピン | \`KANTO/user_pins.json\` | ❌ 失敗 | 無効なJSONまたはstatusエラー |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          jq '.approved // []' "$TMP_RES" > /tmp/new_pins.json
          NEW_COUNT=$(jq 'length' /tmp/new_pins.json)

          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "⏭️ [Approved Pins] 新規本採用ピンは0件です（スキップ）"
            echo "| 2. 本採用ピン | \`KANTO/user_pins.json\` | ⏭️ 更新なし | 新規 0件 |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ! -f "$TARGET_FILE" ]; then
            echo "[]" > "$TARGET_FILE"
          fi

          jq -s '.[0] + .[1] | unique_by(.id)' "$TARGET_FILE" /tmp/new_pins.json > /tmp/merged_pins.json
          if cmp -s /tmp/merged_pins.json "$TARGET_FILE"; then
            echo "⏭️ [Approved Pins] 既存データと同一のためスキップ"
            echo "| 2. 本採用ピン | \`KANTO/user_pins.json\` | ⏭️ 更新なし | 取得済みデータと同一 |" >> "$GITHUB_STEP_SUMMARY"
          else
            mv /tmp/merged_pins.json "$TARGET_FILE"
            TOTAL_COUNT=$(jq 'length' "$TARGET_FILE")
            echo "✅ [Approved Pins] ${NEW_COUNT}件を追加しました（計 ${TOTAL_COUNT}件）"
            echo "| 2. 本採用ピン | \`KANTO/user_pins.json\` | ✅ 更新完了 | 新規 +${NEW_COUNT}件 (計${TOTAL_COUNT}件) |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # 3. XREA 釣果・マップデータの回収
      # ========================================================
      - name: "3. Fetch Map & Catch Data (XREA)"
        continue-on-error: true
        env:
          XREA_EXPORT_KEY: ${{ secrets.XREA_EXPORT_KEY }}
        run: |
          mkdir -p data
          DEST="data/compiled_data.json"
          TMP_FILE="/tmp/compiled_data.json.tmp"

          if [ -z "$XREA_EXPORT_KEY" ]; then
            echo "❌ [XREA] XREA_EXPORT_KEY が未設定です"
            echo "| 3. XREA釣果データ | \`data/compiled_data.json\` | ❌ 失敗 | Secret未設定 |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          URL="https://turiiko.shop/agltest/export_map_data.php?key=${XREA_EXPORT_KEY}&t=$(date +%s)"

          HTTP_CODE=$(curl -sSL -w "%{http_code}" -A "$UA" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: ja,en-US;q=0.9,en;q=0.8" \
            --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 60 \
            "$URL" -o "$TMP_FILE" || echo "000")

          if [ "$HTTP_CODE" != "200" ] || ! jq -e . "$TMP_FILE" > /dev/null 2>&1; then
            echo "❌ [XREA] 取得またはJSON検証に失敗しました (HTTP: $HTTP_CODE)"
            head -n 10 "$TMP_FILE" || true
            echo "| 3. XREA釣果データ | \`data/compiled_data.json\` | ❌ 失敗 | HTTP ${HTTP_CODE} / JSON検証NG |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -f "$DEST" ] && cmp -s "$TMP_FILE" "$DEST"; then
            echo "⏭️ [XREA] 本日のデータは取得済み（変更なし）のためスキップ"
            echo "| 3. XREA釣果データ | \`data/compiled_data.json\` | ⏭️ 更新なし | 変更なし（取得済み） |" >> "$GITHUB_STEP_SUMMARY"
          else
            mv "$TMP_FILE" "$DEST"
            BYTES=$(wc -c < "$DEST")
            echo "✅ [XREA] 更新完了 (${BYTES} bytes)"
            echo "| 3. XREA釣果データ | \`data/compiled_data.json\` | ✅ 更新完了 | ${BYTES} bytes |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # 4. SNS釣果データの回収 (汎用GAS: Gemini/integrated_catch.json)
      #    ※同一ジョブ内の後続ステップはプッシュを待たずこの最新ファイルを直接参照する
      # ========================================================
      - name: "4. Fetch SNS Catch Data (GAS: Gemini folder)"
        continue-on-error: true
        env:
          GAS_URL: ${{ secrets.DRIVE_FETCHER_GAS_URL }}
          SECRET_KEY: "aZ3kP9xQw7LmN2vB8tRc"
          FOLDER_NAME: "Gemini"
          FILE_NAME: "integrated_catch.json"
        run: |
          mkdir -p KANTO
          DEST="KANTO/integrated_catch.json"
          TMP_FILE="/tmp/integrated_catch.json.tmp"
          TARGET_URL="${GAS_URL}?folder=${FOLDER_NAME}&file=${FILE_NAME}&key=${SECRET_KEY}"

          if ! curl -sSL --fail --retry 2 --connect-timeout 15 --max-time 45 "$TARGET_URL" -o "$TMP_FILE"; then
            echo "❌ [SNS Catch] GAS通信エラー"
            echo "| 4. SNS釣果データ | \`KANTO/integrated_catch.json\` | ❌ 失敗 | GAS通信エラー |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! jq -e 'type == "array"' "$TMP_FILE" > /dev/null 2>&1; then
            echo "❌ [SNS Catch] 取得データがJSON配列ではありません"
            head -n 10 "$TMP_FILE" || true
            echo "| 4. SNS釣果データ | \`KANTO/integrated_catch.json\` | ❌ 失敗 | JSON配列検証NG |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -f "$DEST" ] && cmp -s "$TMP_FILE" "$DEST"; then
            echo "⏭️ [SNS Catch] 本日のデータは取得済み（変更なし）のためスキップ"
            echo "| 4. SNS釣果データ | \`KANTO/integrated_catch.json\` | ⏭️ 更新なし | 変更なし（取得済み） |" >> "$GITHUB_STEP_SUMMARY"
          else
            mv "$TMP_FILE" "$DEST"
            COUNT=$(jq 'length' "$DEST")
            echo "✅ [SNS Catch] 更新完了 (${COUNT}件)"
            echo "| 4. SNS釣果データ | \`KANTO/integrated_catch.json\` | ✅ 更新完了 | 全 ${COUNT}件 |" >> "$GITHUB_STEP_SUMMARY"
          fi

          sleep 2

      # ========================================================
      # 5. ニュースリストの回収 (汎用GAS: Muse/newslist.json)
      # ========================================================
      - name: "5. Fetch Newslist Data (GAS: Muse folder)"
        continue-on-error: true
        env:
          GAS_URL: ${{ secrets.DRIVE_FETCHER_GAS_URL }}
          SECRET_KEY: "aZ3kP9xQw7LmN2vB8tRc"
          FOLDER_NAME: "Muse"
          FILE_NAME: "newslist.json"
        run: |
          mkdir -p data
          DEST="data/newslist.json"
          TMP_FILE="/tmp/newslist.json.tmp"
          TARGET_URL="${GAS_URL}?folder=${FOLDER_NAME}&file=${FILE_NAME}&key=${SECRET_KEY}"

          if ! curl -sSL --fail --retry 2 --connect-timeout 15 --max-time 45 "$TARGET_URL" -o "$TMP_FILE"; then
            echo "❌ [Newslist] GAS通信エラー"
            echo "| 5. ニュースリスト | \`data/newslist.json\` | ❌ 失敗 | GAS通信エラー |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          STATUS=$(jq -r 'if type == "object" then .status // empty else empty end' "$TMP_FILE" 2>/dev/null || echo "invalid")
          if [ "$STATUS" = "error" ] || ! jq -e . "$TMP_FILE" > /dev/null 2>&1; then
            echo "❌ [Newslist] GASエラーまたは無効なJSON"
            head -n 10 "$TMP_FILE" || true
            echo "| 5. ニュースリスト | \`data/newslist.json\` | ❌ 失敗 | JSON検証NG |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -f "$DEST" ] && cmp -s "$TMP_FILE" "$DEST"; then
            echo "⏭️ [Newslist] 本日のデータは取得済み（変更なし）のためスキップ"
            echo "| 5. ニュースリスト | \`data/newslist.json\` | ⏭️ 更新なし | 変更なし（取得済み） |" >> "$GITHUB_STEP_SUMMARY"
          else
            mv "$TMP_FILE" "$DEST"
            echo "✅ [Newslist] 更新完了"
            echo "| 5. ニュースリスト | \`data/newslist.json\` | ✅ 更新完了 | 最新データを反映 |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # 6. Node.js セットアップ ＆ 関東雨雲画像の回収
      # ========================================================
      - name: "6. Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: "6. Acquire KANTO Cloud Images & Cleanup"
        continue-on-error: true
        run: |
          if node js/acquireCrowds.cjs; then
            curl -s --max-time 2 "https://turiiko.shop/cloudGenerator2/cleanup.php" > /dev/null 2>&1 &
            sleep 1
            echo "✅ [Cloud Images] 雨雲画像の取得とクリーンアップ完了"
            echo "| 6. 関東雨雲画像 | \`KANTO / 画像群\` | ✅ 実行完了 | フェッチ＆XREAクリーンアップ済 |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ [Cloud Images] スクリプト実行エラー"
            echo "| 6. 関東雨雲画像 | \`KANTO / 画像群\` | ❌ 失敗 | acquireCrowds.cjs エラー |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # ========================================================
      # 7. 最新SNS釣果MDの再生成（直前Step4で取得したワークスペース上の最新JSONを直接参照）
      # ========================================================
      - name: "7. Generate Catch Markdowns (from workspace cache)"
        continue-on-error: true
        run: |
          if [ -f "script/generate_catch_md.js" ]; then
            node script/generate_catch_md.js ALL KANTO
            echo "| 7. SNS釣果MD生成 | \`ai-data/*_catch.md\` | ✅ 生成完了 | 直前取得の最新SNS釣果から生成 |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ script/generate_catch_md.js が見つからないためスキップ"
            echo "| 7. SNS釣果MD生成 | \`ai-data/*_catch.md\` | ⏭️ スキップ | スクリプト未配置 |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # 8. ランキング・根拠ポップアップ・軽量HTML・本番 index.html の一括生成
      #    （Step1の天気v2 JSON・Step4のSNS釣果・Step7のMDをプッシュ待ちせずそのまま参照）
      # ========================================================
      - name: "8. Generate Ranking, Lightweight HTMLs & Production index.html"
        continue-on-error: true
        env:
          TEMPLATE_PATH: "template/index.txt"
        run: |
          node script/generate_ranking_and_index.js KANTO index.html
          echo "| 8. ランキング＆静的HTML | \`index.html / ai-data/*.html\` | ✅ 生成完了 | 最新天気・SNS釣果から一括ビルド |" >> "$GITHUB_STEP_SUMMARY"

      # ========================================================
      # 9. llms.txt の最新化
      # ========================================================
      - name: "9. Refresh llms.txt"
        continue-on-error: true
        run: |
          if [ -f "script/generate_pref_md.js" ]; then
            node script/generate_pref_md.js LLMS KANTO
            echo "| 9. AI目次更新 | \`llms.txt\` | ✅ 更新完了 | 全MD一覧を再構築 |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ script/generate_pref_md.js が見つからないためスキップ"
            echo "| 9. AI目次更新 | \`llms.txt\` | ⏭️ スキップ | スクリプト未配置 |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # 10. 一括コミット・プッシュ
      # ========================================================
      - name: "10. Commit and Push Changes"
        id: commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "🤖 auto: 朝のデータ定期同期＆index.html静的ビルド (06:00 JST)"
            git pull --rebase --autostash origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **全データおよび本番 index.html をリポジトリへ一括コミット＆プッシュしました。**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⏭️ **全データに変更がなかったため、コミットとデプロイをスキップしました。**" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # 11. GitHub Pages デプロイ（更新がある時 または force_deploy=true 時のみ）
      # ========================================================
      - name: "11. Upload Pages Artifact"
        if: steps.commit.outputs.pushed == 'true' || inputs.force_deploy == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: "12. Deploy to GitHub Pages"
        id: deployment
        if: steps.commit.outputs.pushed == 'true' || inputs.force_deploy == true
        uses: actions/deploy-pages@v4
