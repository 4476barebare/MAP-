name: "Morning Data Sync (06:00 JST)"

on:
  schedule:
    # UTC 21:00 = 日本時間(JST) 毎日 06:00
    - cron: '0 21 * * *'
  workflow_dispatch:

# デプロイ渋滞・Git競合を防ぐ排他制御（実行中の処理はキャンセルせず順番待ち）
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  morning-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Summary Table
        run: |
          echo "### 🌅 朝のデータ同期 実行結果 (JST 06:00)" >> "$GITHUB_STEP_SUMMARY"
          echo "| 対象データ | 保存先 | ステータス | 詳細 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"

      # ========================================================
      # 1. 本採用ピンの回収 (専用GAS)
      # ========================================================
      - name: "1. Fetch Approved Pins (GAS)"
        continue-on-error: true
        env:
          GAS_URL: ${{ secrets.TEMP_PIN_GAS_URL }}
          SECRET_KEY: "aZ3kP9xQw7LmN2vB8tRc"
        run: |
          mkdir -p KANTO
          TARGET_FILE="KANTO/user_pins.json"
          TMP_RES="/tmp/pins_response.json"

          if ! curl -sSL --fail --retry 2 --connect-timeout 15 --max-time 45 \
            "${GAS_URL}?action=export_approved&key=${SECRET_KEY}" -o "$TMP_RES"; then
            echo "❌ [Approved Pins] GAS通信に失敗しました"
            echo "| 1. 本採用ピン | \`KANTO/user_pins.json\` | ❌ 失敗 | GAS通信エラー |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          STATUS=$(jq -r 'if type == "object" then .status // empty else empty end' "$TMP_RES" 2>/dev/null || echo "invalid")
          if [ "$STATUS" != "ok" ]; then
            echo "❌ [Approved Pins] レスポンス検証エラー"
            head -n 5 "$TMP_RES" || true
            echo "| 1. 本採用ピン | \`KANTO/user_pins.json\` | ❌ 失敗 | 無効なJSONまたはstatusエラー |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          jq '.approved // []' "$TMP_RES" > /tmp/new_pins.json
          NEW_COUNT=$(jq 'length' /tmp/new_pins.json)

          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "⏭️ [Approved Pins] 新規本採用ピンは0件です（スキップ）"
            echo "| 1. 本採用ピン | \`KANTO/user_pins.json\` | ⏭️ 更新なし | 新規 0件 |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ! -f "$TARGET_FILE" ]; then
            echo "[]" > "$TARGET_FILE"
          fi

          jq -s '.[0] + .[1] | unique_by(.id)' "$TARGET_FILE" /tmp/new_pins.json > /tmp/merged_pins.json
          if cmp -s /tmp/merged_pins.json "$TARGET_FILE"; then
            echo "⏭️ [Approved Pins] 既存データと同一のためスキップ"
            echo "| 1. 本採用ピン | \`KANTO/user_pins.json\` | ⏭️ 更新なし | 取得済みデータと同一 |" >> "$GITHUB_STEP_SUMMARY"
          else
            mv /tmp/merged_pins.json "$TARGET_FILE"
            TOTAL_COUNT=$(jq 'length' "$TARGET_FILE")
            echo "✅ [Approved Pins] ${NEW_COUNT}件を追加しました（計 ${TOTAL_COUNT}件）"
            echo "| 1. 本採用ピン | \`KANTO/user_pins.json\` | ✅ 更新完了 | 新規 +${NEW_COUNT}件 (計${TOTAL_COUNT}件) |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # 2. XREA 釣果・マップデータの回収
      # ========================================================
      - name: "2. Fetch Map & Catch Data (XREA)"
        continue-on-error: true
        env:
          XREA_EXPORT_KEY: ${{ secrets.XREA_EXPORT_KEY }}
        run: |
          mkdir -p data
          DEST="data/compiled_data.json"
          TMP_FILE="/tmp/compiled_data.json.tmp"

          if [ -z "$XREA_EXPORT_KEY" ]; then
            echo "❌ [XREA] XREA_EXPORT_KEY が未設定です"
            echo "| 2. XREA釣果データ | \`data/compiled_data.json\` | ❌ 失敗 | Secret未設定 |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          URL="https://turiiko.shop/agltest/export_map_data.php?key=${XREA_EXPORT_KEY}&t=$(date +%s)"

          HTTP_CODE=$(curl -sSL -w "%{http_code}" -A "$UA" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: ja,en-US;q=0.9,en;q=0.8" \
            --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 60 \
            "$URL" -o "$TMP_FILE" || echo "000")

          if [ "$HTTP_CODE" != "200" ] || ! jq -e . "$TMP_FILE" > /dev/null 2>&1; then
            echo "❌ [XREA] 取得またはJSON検証に失敗しました (HTTP: $HTTP_CODE)"
            head -n 10 "$TMP_FILE" || true
            echo "| 2. XREA釣果データ | \`data/compiled_data.json\` | ❌ 失敗 | HTTP ${HTTP_CODE} / JSON検証NG |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -f "$DEST" ] && cmp -s "$TMP_FILE" "$DEST"; then
            echo "⏭️ [XREA] 本日のデータは取得済み（変更なし）のためスキップ"
            echo "| 2. XREA釣果データ | \`data/compiled_data.json\` | ⏭️ 更新なし | 変更なし（取得済み） |" >> "$GITHUB_STEP_SUMMARY"
          else
            mv "$TMP_FILE" "$DEST"
            BYTES=$(wc -c < "$DEST")
            echo "✅ [XREA] 更新完了 (${BYTES} bytes)"
            echo "| 2. XREA釣果データ | \`data/compiled_data.json\` | ✅ 更新完了 | ${BYTES} bytes |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # 3. SNS釣果データの回収 (汎用GAS: Gemini/integrated_catch.json)
      # ========================================================
      - name: "3. Fetch SNS Catch Data (GAS: Gemini folder)"
        continue-on-error: true
        env:
          GAS_URL: ${{ secrets.DRIVE_FETCHER_GAS_URL }}
          SECRET_KEY: "aZ3kP9xQw7LmN2vB8tRc"
          FOLDER_NAME: "Gemini"
          FILE_NAME: "integrated_catch.json"
        run: |
          mkdir -p KANTO
          DEST="KANTO/integrated_catch.json"
          TMP_FILE="/tmp/integrated_catch.json.tmp"
          TARGET_URL="${GAS_URL}?folder=${FOLDER_NAME}&file=${FILE_NAME}&key=${SECRET_KEY}"

          if ! curl -sSL --fail --retry 2 --connect-timeout 15 --max-time 45 "$TARGET_URL" -o "$TMP_FILE"; then
            echo "❌ [SNS Catch] GAS通信エラー"
            echo "| 3. SNS釣果データ | \`KANTO/integrated_catch.json\` | ❌ 失敗 | GAS通信エラー |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # エラーオブジェクトでなく、有効なJSON配列であるか検証
          if ! jq -e 'type == "array"' "$TMP_FILE" > /dev/null 2>&1; then
            echo "❌ [SNS Catch] 取得データがJSON配列ではありません"
            head -n 10 "$TMP_FILE" || true
            echo "| 3. SNS釣果データ | \`KANTO/integrated_catch.json\` | ❌ 失敗 | JSON配列検証NG |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -f "$DEST" ] && cmp -s "$TMP_FILE" "$DEST"; then
            echo "⏭️ [SNS Catch] 本日のデータは取得済み（変更なし）のためスキップ"
            echo "| 3. SNS釣果データ | \`KANTO/integrated_catch.json\` | ⏭️ 更新なし | 変更なし（取得済み） |" >> "$GITHUB_STEP_SUMMARY"
          else
            mv "$TMP_FILE" "$DEST"
            COUNT=$(jq 'length' "$DEST")
            echo "✅ [SNS Catch] 更新完了 (${COUNT}件)"
            echo "| 3. SNS釣果データ | \`KANTO/integrated_catch.json\` | ✅ 更新完了 | 全 ${COUNT}件 |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 連続リクエストによるGAS負荷を避けるため2秒待機
          sleep 2

      # ========================================================
      # 4. ニュースリストの回収 (汎用GAS: Muse/newslist.json)
      # ========================================================
      - name: "4. Fetch Newslist Data (GAS: Muse folder)"
        continue-on-error: true
        env:
          GAS_URL: ${{ secrets.DRIVE_FETCHER_GAS_URL }}
          SECRET_KEY: "aZ3kP9xQw7LmN2vB8tRc"
          FOLDER_NAME: "Muse"
          FILE_NAME: "newslist.json"
        run: |
          mkdir -p data
          DEST="data/newslist.json"
          TMP_FILE="/tmp/newslist.json.tmp"
          TARGET_URL="${GAS_URL}?folder=${FOLDER_NAME}&file=${FILE_NAME}&key=${SECRET_KEY}"

          if ! curl -sSL --fail --retry 2 --connect-timeout 15 --max-time 45 "$TARGET_URL" -o "$TMP_FILE"; then
            echo "❌ [Newslist] GAS通信エラー"
            echo "| 4. ニュースリスト | \`data/newslist.json\` | ❌ 失敗 | GAS通信エラー |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          STATUS=$(jq -r 'if type == "object" then .status // empty else empty end' "$TMP_FILE" 2>/dev/null || echo "invalid")
          if [ "$STATUS" = "error" ] || ! jq -e . "$TMP_FILE" > /dev/null 2>&1; then
            echo "❌ [Newslist] GASエラーまたは無効なJSON"
            head -n 10 "$TMP_FILE" || true
            echo "| 4. ニュースリスト | \`data/newslist.json\` | ❌ 失敗 | JSON検証NG |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -f "$DEST" ] && cmp -s "$TMP_FILE" "$DEST"; then
            echo "⏭️ [Newslist] 本日のデータは取得済み（変更なし）のためスキップ"
            echo "| 4. ニュースリスト | \`data/newslist.json\` | ⏭️ 更新なし | 変更なし（取得済み） |" >> "$GITHUB_STEP_SUMMARY"
          else
            mv "$TMP_FILE" "$DEST"
            echo "✅ [Newslist] 更新完了"
            echo "| 4. ニュースリスト | \`data/newslist.json\` | ✅ 更新完了 | 最新データを反映 |" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # 5. 関東雨雲画像の回収 ＆ XREAクリーンアップ
      # ========================================================
      - name: "5. Setup Node.js for Cloud Images"
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: "5. Acquire KANTO Cloud Images & Cleanup"
        continue-on-error: true
        run: |
          if node js/acquireCrowds.cjs; then
            curl -s --max-time 2 "https://turiiko.shop/cloudGenerator2/cleanup.php" > /dev/null 2>&1 &
            sleep 1
            echo "✅ [Cloud Images] 雨雲画像の取得とクリーンアップ完了"
            echo "| 5. 関東雨雲画像 | \`KANTO / 画像群\` | ✅ 実行完了 | フェッチ＆XREAクリーンアップ済 |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ [Cloud Images] スクリプト実行エラー"
            echo "| 5. 関東雨雲画像 | \`KANTO / 画像群\` | ❌ 失敗 | acquireCrowds.cjs エラー |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # ========================================================
      # 6. 変更確認・コミット・プッシュ
      # ========================================================
      - name: "6. Commit and Push Changes"
        id: commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "🤖 auto: 朝のデータ定期同期 (06:00 JST)"
            git pull --rebase --autostash origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **リポジトリへ変更をコミット＆プッシュしました。**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⏭️ **全データに変更がなかったため、コミットとデプロイをスキップしました。**" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========================================================
      # 7. GitHub Pages デプロイ（更新がある時 または 手動実行時のみ）
      # ========================================================
      - name: "7. Upload Pages Artifact"
        if: steps.commit.outputs.pushed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: "8. Deploy to GitHub Pages"
        id: deployment
        if: steps.commit.outputs.pushed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
