name: Recalculate InLand Weather Data

on:
  schedule:
    - cron: '0 2 * * *' # 🌟 timezone指定があるため「そのまま日本時間の深夜2時」と書きます
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

# 🌟 デプロイの渋滞エラーを防止する安全装置を追加
concurrency:
  group: "pages"
  cancel-in-progress: true

# Gitへの書き込み権限と、Pagesへの直接デプロイ権限を設定
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  recalculate:
    runs-on: ubuntu-latest
    
    # 🌟 GitHub Pagesへのデプロイ権限を証明するために必須の記述
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # ← ログからURLへ飛べるように追加

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # ここを24にし、cache: 'npm' を完全に削除しました

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found. Skipping npm install."
          fi

      - name: Run recalculation script
        run: node js/recalcInLand.js
        env:
          TZ: 'Asia/Tokyo' # 日付判定を日本時間に合わせるため必須

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add data/
          
          if ! git diff --cached --quiet; then
            git commit -m "🤖 auto: [KANTO] 内陸補間データの再計算を反映"
            git push origin main
          else
            echo "✅ 変更がない（またはスキップされた）ため、コミットしませんでした。"
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment # 🌟 デプロイIDを付与（推奨）
        uses: actions/deploy-pages@v4
