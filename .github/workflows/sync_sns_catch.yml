name: Sync SNS Catch Data from Google Drive

on:
  schedule:
    # UTC 10:00 = JST 19:00 に毎日実行
    - cron: '0 10 * * *'
  workflow_dispatch: # 手動テスト実行ボタンも有効化

permissions:
  contents: write

jobs:
  sync-json:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch integrated_catch.json from GAS
        env:
          # GitHub Secrets に登録するか、直接ここにURLを貼っても動作します
          GAS_URL: https://script.google.com/macros/s/AKfycby45YnjGN_dUefR0q6eFwKKQRsfzeoRJ9Dwa-UNbfvz429VFZaoQ40ntfoq593JwKPArw/exec
        run: |
          mkdir -p KANTO
          # GASのリダイレクト(-L)を追跡して取得
          curl -sSL "$GAS_URL" -o /tmp/integrated_catch.json

          # 取得したファイルが空でなく、正しいJSON配列であるか検証（Ubuntu標準のjqを使用）
          jq -e 'type == "array"' /tmp/integrated_catch.json > /dev/null

          # 検証OKなら KANTO/integrated_catch.json へ配置
          mv /tmp/integrated_catch.json KANTO/integrated_catch.json
          echo "Successfully fetched $(jq 'length' KANTO/integrated_catch.json) records."

      - name: Commit and Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KANTO/integrated_catch.json

          # 差分がある時だけコミット＆プッシュ
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update KANTO/integrated_catch.json"
            git push
          fi
