name: Sync SNS Catch Data from Google Drive

on:
  schedule:
    # UTC 10:00 = JST 毎日19:00 に自動実行
    - cron: '0 10 * * *'
  workflow_dispatch: # 手動テスト実行ボタン

permissions:
  contents: write

jobs:
  sync-json:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch integrated_catch.json from GAS
        env:
          SNS_SECRET: ${{ secrets.SNS_secretkey }}
          # ※SNS_secretkeyに「URLそのもの」を入れた場合は下のGAS_BASE_URLは変更不要です
          # ※SNS_secretkeyに「合言葉」を入れた場合は、ここにGASのURLを貼ってください
          GAS_BASE_URL: "https://script.google.com/macros/s/ここにGASのURL/exec"
        run: |
          mkdir -p KANTO

          if [[ "$SNS_SECRET" == https://* ]]; then
            TARGET_URL="$SNS_SECRET"
          else
            TARGET_URL="${GAS_BASE_URL}?key=${SNS_SECRET}"
          fi

          # GASのリダイレクト(-L)を追跡してJSONを取得
          curl -sSL "$TARGET_URL" -o /tmp/integrated_catch.json

          # 正しいJSON配列であるか検証（エラー時はここでストップし本番ファイルを保護）
          jq -e 'type == "array"' /tmp/integrated_catch.json > /dev/null

          mv /tmp/integrated_catch.json KANTO/integrated_catch.json
          echo "Successfully fetched $(jq 'length' KANTO/integrated_catch.json) records."

      - name: Commit and Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KANTO/integrated_catch.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update KANTO/integrated_catch.json"
            git push
          fi
