<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホネイティブ・コードエディタ</title>
    <!-- CodeMirror -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.css">
    <style>
        /* =========================================================
           画面全体
        ========================================================= */
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            background-color: #121212;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;
            overflow: hidden;
        }
        /* =========================================================
           ツールバー
        ========================================================= */
        #toolbar {
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000000;
            border-bottom: 1px solid #333;
            min-height: 44px;
            user-select: none;
        }
        .button-group {
            display: flex;
            gap: 8px;
        }
        button {
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
            background-color: transparent;
            color: #0A84FF;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        button:active {
            background-color: rgba(10, 132, 255, 0.2);
        }
        #file-name-display {
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* =========================================================
           エディタ
        ========================================================= */
        #editor-container {
            flex-grow: 1;
            width: 100%;
            position: relative;
        }
        .CodeMirror {
            height: 100%;
            font-family:
                Menlo,
                Monaco,
                "Courier New",
                monospace;
            -webkit-user-select: auto !important;
            user-select: text;
            font-size: 8px;
            line-height: 14px;
        }
        /* =========================================================
           通常状態
           ここは常に小さい文字
        ========================================================= */
        .cm-s-custom.CodeMirror {
            background-color: #1a1a1c;
            color: #d4d4d4;
            font-size: 8px;
            line-height: 14px;
        }
        .cm-s-custom .CodeMirror-gutters {
            background-color: #1a1a1c;
            border-right: none;
        }
        .cm-s-custom .CodeMirror-linenumber {
            color: #5a5a5f;
            font-size: 8px;
        }
        /* =========================================================
           構文カラー
        ========================================================= */
        .cm-s-custom .cm-comment {
            color: #7a7a7a;
            font-style: italic;
        }
        .cm-s-custom .cm-string {
            color: #c88251;
        }
        .cm-s-custom .cm-keyword {
            color: #569cd6;
        }
        .cm-s-custom .cm-variable-2 {
            color: #a381d6;
        }
        .cm-s-custom .cm-def {
            color: #569cd6;
        }
        .cm-s-custom .cm-number {
            color: #b5cea8;
        }
        .cm-s-custom .cm-tag {
            color: #569cd6;
        }
        .cm-s-custom .cm-attribute {
            color: #4ec9b0;
        }
        /* =========================================================
           ★ 開いているブロックだけ拡大
           
           折り畳み対象外の行にはこのクラスが付かないため、
           そこは8pxのまま。
        ========================================================= */
        .CodeMirror .expanded-code-line {
            font-size: 12px !important;
            line-height: 18px !important;
        }
        .CodeMirror .expanded-code-line .cm-comment,
        .CodeMirror .expanded-code-line .cm-string,
        .CodeMirror .expanded-code-line .cm-keyword,
        .CodeMirror .expanded-code-line .cm-variable-2,
        .CodeMirror .expanded-code-line .cm-def,
        .CodeMirror .expanded-code-line .cm-number,
        .CodeMirror .expanded-code-line .cm-tag,
        .CodeMirror .expanded-code-line .cm-attribute {
            font-size: 12px;
        }
        /* =========================================================
           行番号も開いたブロックだけ12px
        ========================================================= */
        .CodeMirror .expanded-code-line-number {
            font-size: 12px !important;
            line-height: 18px !important;
        }
        /* =========================================================
           折り畳みマーカー
        ========================================================= */
        .CodeMirror-foldmarker {
            color: #0A84FF;
            text-shadow: none;
            font-family: sans-serif;
            cursor: pointer;
            padding: 0 4px;
        }
        .CodeMirror-foldgutter {
            width: 20px;
        }
        /*
         * 表示そのものは小さくするが、
         * 指で触れる領域は確保する。
         */
        .CodeMirror-foldgutter-open,
        .CodeMirror-foldgutter-folded {
            position: relative;
            width: 20px;
            min-width: 20px;
            cursor: pointer;
        }
        .CodeMirror-foldgutter-open:after {
            content: "▼";
            color: #5a5a5f;
            font-size: 8px;
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
        }
        .CodeMirror-foldgutter-folded:after {
            content: "▶";
            color: #0A84FF;
            font-size: 8px;
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
        }
        /* =========================================================
           折り畳まれた行の「...」表示
        ========================================================= */
        .CodeMirror-foldmarker {
            background: transparent;
            font-size: 8px;
        }
    </style>
</head>
<body>
    <!-- =========================================================
         ツールバー
    ========================================================= -->
    <div id="toolbar">
        <div class="button-group">
            <button onclick="document.getElementById('file-input').click()">
                📂 開く
            </button>
            <button onclick="downloadFile()">
                💾 保存
            </button>
            <button onclick="copyText()">
                📋 コピー
            </button>
        </div>
        <input
            type="file"
            id="file-input"
            style="display: none;"
            onchange="loadFile(event)"
        >
        <div>
            <span id="file-name-display">
                新規ファイル
            </span>
        </div>
    </div>
    <!-- =========================================================
         エディタ
    ========================================================= -->
    <div id="editor-container"></div>
    <!-- =========================================================
         CodeMirror本体
    ========================================================= -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <!-- モード -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/php/php.min.js"></script>
    <!-- =========================================================
         折り畳み
    ========================================================= -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/brace-fold.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/xml-fold.min.js"></script>
    <script>
        /* =========================================================
           現在のファイル
        ========================================================= */
        let currentFileName = 'untitled.js';
        /* =========================================================
           拡張子 → CodeMirrorモード
        ========================================================= */
        const extensionToMode = {
            'js': 'javascript',
            'php': 'php',
            'html': 'htmlmixed',
            'css': 'css',
            'json': 'javascript',
            'txt': 'null'
        };
        /* =========================================================
           エディタ初期化
        ========================================================= */
        const editor = CodeMirror(
            document.getElementById('editor-container'),
            {
                value:
                    "// ここにコードをペーストするか、ファイルを開いてください",
                mode: "javascript",
                theme: "custom",
                lineNumbers: true,
                lineWrapping: true,
                /* iPhoneの入力操作 */
                inputStyle: "contenteditable",
                spellcheck: false,
                /* 折り畳み */
                foldGutter: true,
                gutters: [
                    "CodeMirror-linenumbers",
                    "CodeMirror-foldgutter"
                ]
            }
        );
        /* =========================================================
           現在開いているブロック
           
           複数ブロックを同時に開けるよう配列で管理。
        ========================================================= */
        let expandedBlocks = [];
        /* =========================================================
           ブロックを拡大
        ========================================================= */
        function expandBlock(from, to) {
            if (!from || !to) return;
            const block = {
                from: from.line,
                to: to.line
            };
            expandedBlocks.push(block);
            /*
             * ブロック内の文字を12pxにする
             */
            for (
                let i = block.from;
                i <= block.to;
                i++
            ) {
                editor.addLineClass(
                    i,
                    "text",
                    "expanded-code-line"
                );
            }
            /*
             * 行番号も12px
             */
            for (
                let i = block.from;
                i <= block.to;
                i++
            ) {
                editor.addLineClass(
                    i,
                    "gutter",
                    "expanded-code-line-number"
                );
            }
            editor.refresh();
        }
        /* =========================================================
           ブロックを縮小
        ========================================================= */
        function collapseBlock(from, to) {
            if (!from || !to) return;
            const fromLine = from.line;
            const toLine = to.line;
            for (
                let i = fromLine;
                i <= toLine;
                i++
            ) {
                editor.removeLineClass(
                    i,
                    "text",
                    "expanded-code-line"
                );
                editor.removeLineClass(
                    i,
                    "gutter",
                    "expanded-code-line-number"
                );
            }
            /*
             * 管理配列から削除
             */
            expandedBlocks =
                expandedBlocks.filter(function(block) {
                    return !(
                        block.from === fromLine &&
                        block.to === toLine
                    );
                });
            editor.refresh();
        }
        /* =========================================================
           折り畳みイベント
           
           CodeMirrorがブロックを開いた時
           → 12px
           CodeMirrorがブロックを閉じた時
           → 8px
        ========================================================= */
        editor.on(
            "unfold",
            function(from, to) {
                expandBlock(from, to);
            }
        );
        editor.on(
            "fold",
            function(from, to) {
                collapseBlock(from, to);
            }
        );
        /* =========================================================
           ファイル読み込み
        ========================================================= */
        function loadFile(event) {
            const file =
                event.target.files[0];
            if (!file) return;
            const reader =
                new FileReader();
            reader.onload = function(e) {
                /*
                 * コードをセット
                 */
                editor.setValue(
                    e.target.result
                );
                currentFileName =
                    file.name;
                document.getElementById(
                    'file-name-display'
                ).textContent =
                    currentFileName;
                /*
                 * 言語切り替え
                 */
                const ext =
                    currentFileName
                        .split('.')
                        .pop()
                        .toLowerCase();
                const mode =
                    extensionToMode[ext] || 'null';
                editor.setOption(
                    "mode",
                    mode
                );
                /*
                 * 以前の拡大状態をリセット
                 */
                expandedBlocks = [];
                /*
                 * 行クラスをクリア
                 */
                editor.operation(function() {
                    for (
                        let i = 0;
                        i < editor.lineCount();
                        i++
                    ) {
                        editor.removeLineClass(
                            i,
                            "text",
                            "expanded-code-line"
                        );
                        editor.removeLineClass(
                            i,
                            "gutter",
                            "expanded-code-line-number"
                        );
                    }
                });
                /*
                 * CodeMirrorの構文解析が終わってから
                 * 全ブロックを折り畳む。
                 */
                setTimeout(function() {
                    editor.operation(function() {
                        for (
                            let i = 0;
                            i < editor.lineCount();
                            i++
                        ) {
                            editor.foldCode(
                                CodeMirror.Pos(i, 0),
                                null,
                                "fold"
                            );
                        }
                    });
                }, 150);
            };
            reader.readAsText(file);
            /*
             * 同じファイルを再度選択できるようにする
             */
            event.target.value = '';
        }
        /* =========================================================
           コピー
           
           選択範囲があれば選択部分。
           なければファイル全体。
        ========================================================= */
        async function copyText() {
            const selected =
                editor.getSelection();
            const text =
                selected
                    ? selected
                    : editor.getValue();
            if (!text) return;
            try {
                await navigator.clipboard.writeText(
                    text
                );
                alert(
                    selected
                        ? '選択範囲をコピーしました！'
                        : 'ファイル全体をコピーしました！'
                );
            } catch (err) {
                alert(
                    '画面を長押ししてコピーしてください'
                );
            }
        }
        /* =========================================================
           保存
        ========================================================= */
        function downloadFile() {
            const code =
                editor.getValue();
            const blob =
                new Blob(
                    [code],
                    {
                        type: 'text/plain'
                    }
                );
            const url =
                URL.createObjectURL(blob);
            const a =
                document.createElement('a');
            a.href =
                url;
            a.download =
                currentFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            /*
             * 保存したことをファイル名で表示
             */
            const nameDisplay =
                document.getElementById(
                    'file-name-display'
                );
            nameDisplay.style.color =
                '#0A84FF';
            setTimeout(function() {
                nameDisplay.style.color =
                    '#ffffff';
            }, 1000);
        }
    </script>
</body>
</html>
