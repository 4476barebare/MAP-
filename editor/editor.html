<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>スマホ特化型コードエディタUI</title>
  <link rel="stylesheet" href=" editor.css">
</head>
<body>

  <!-- メインヘッダー（シャドウで浮かす） -->
  <header id="main-header">
    <button class="icon-btn" id="btn-menu">
      <svg class="svg-icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="file-title">index.html</div>
    <div class="header-actions">
      <button class="text-btn">ロード</button>
      <button class="text-btn">出力</button>
    </div>
  </header>

  <!-- サブヘッダー（左詰め・SVGアイコン化） -->
  <div id="sub-header" class="hidden">
    <button class="icon-btn" id="btn-undo">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a4 4 0 0 1 0 8h-1"/></svg>
    </button>
    <button class="icon-btn" id="btn-redo">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a4 4 0 0 0 0 8h1"/></svg>
    </button>
    <div class="divider"></div>
    <button class="icon-btn" id="btn-left">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="btn-right">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <!-- ドリルダウン用メニュー -->
  <nav id="drawer-menu">
    <div class="drawer-header">
      <button class="icon-btn" id="btn-back">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="breadcrumb">全体 &gt; main-content</div>
    </div>
    <ul class="element-list">
      <li class="element-item" data-target="block1"><span class="tag">div</span> .katsuura-area</li>
      <li class="element-item" data-target="block2"><span class="tag">div</span> .choshi-area</li>
    </ul>
    <button class="add-btn">＋ 子要素を追加</button>
  </nav>

  <!-- メイン編集エリア（余白最小・フォント8px） -->
  <main id="editor-area">
    <div class="code-block" id="block1">
      <span class="tag">&lt;div class="katsuura-area"&gt;</span><br>
      &nbsp;&nbsp;&lt;h2&gt;勝浦漁港の活気&lt;/h2&gt;<br>
      &nbsp;&nbsp;&lt;p&gt;黒潮の恵みを受ける沿岸部。&lt;/p&gt;<br>
      <span class="tag">&lt;/div&gt;</span>
    </div>
    
    <div class="code-block" id="block2">
      <span class="tag">&lt;div class="choshi-area"&gt;</span><br>
      &nbsp;&nbsp;&lt;h2&gt;犬吠埼の絶景&lt;/h2&gt;<br>
      <span class="tag">&lt;/div&gt;</span>
    </div>
  </main>

  <!-- チャット風入力欄（重ね付け＆上部シャドウ） -->
  <div id="chat-input-area">
    <div class="chat-input-wrapper">
      <textarea id="chat-textarea" placeholder="テキストを編集・追記..."
                name="dummy-random-string-xyz" 
                autocomplete="nope" 
                autocorrect="off" 
                autocapitalize="none" 
                spellcheck="false" 
                inputmode="text"
                data-lpignore="true" 
                data-1p-ignore></textarea>
      <button id="btn-send">
        <svg class="svg-icon" viewBox="0 0 24 24" style="color:var(--bg-color); stroke-width:3;"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
