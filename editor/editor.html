<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホネイティブ・コードエディタ</title>
    <!-- =====================================================
         CodeMirror
    ====================================================== -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.css">
    <style>
        /* =====================================================
           全体
        ====================================================== */
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            background-color: #121212;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;
            overflow: hidden;
        }
        /* =====================================================
           ツールバー
        ====================================================== */
        #toolbar {
            min-height: 44px;
            padding: 8px 10px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #000000;
            border-bottom: 1px solid #333;
            user-select: none;
        }
        .button-group {
            display: flex;
            gap: 8px;
        }
        button {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            background-color: transparent;
            color: #0A84FF;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            background-color:
                rgba(10, 132, 255, 0.2);
        }
        #file-name-display {
            max-width: 110px;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* =====================================================
           エディタ
        ====================================================== */
        #editor-container {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow: hidden;
        }
        .CodeMirror {
            width: 100%;
            height: 100%;
            font-family:
                Menlo,
                Monaco,
                "Courier New",
                monospace;
            font-size: 8px;
            line-height: 14px;
            /*
             * iOS標準のテキスト選択を優先
             */
            -webkit-user-select: text !important;
            user-select: text !important;
            -webkit-touch-callout: default;
            touch-action: manipulation;
        }
        /* =====================================================
           メインスクロール
        ====================================================== */
        .CodeMirror-scroll {
            overflow-x: auto !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }
        /* =====================================================
           テーマ
        ====================================================== */
        .cm-s-custom.CodeMirror {
            background-color: #1a1a1c;
            color: #d4d4d4;
            font-size: 8px;
            line-height: 14px;
        }
        .cm-s-custom .CodeMirror-gutters {
            background-color: #1a1a1c;
            border-right: none;
        }
        .cm-s-custom .CodeMirror-linenumber {
            color: #5a5a5f;
            font-size: 8px;
        }
        /* =====================================================
           構文カラー
        ====================================================== */
        .cm-s-custom .cm-comment {
            color: #7a7a7a;
            font-style: italic;
        }
        .cm-s-custom .cm-string {
            color: #c88251;
        }
        .cm-s-custom .cm-keyword {
            color: #569cd6;
        }
        .cm-s-custom .cm-variable-2 {
            color: #a381d6;
        }
        .cm-s-custom .cm-def {
            color: #569cd6;
        }
        .cm-s-custom .cm-number {
            color: #b5cea8;
        }
        .cm-s-custom .cm-tag {
            color: #569cd6;
        }
        .cm-s-custom .cm-attribute {
            color: #4ec9b0;
        }
        /* =====================================================
           折り畳みガター
        ====================================================== */
        .CodeMirror-foldgutter {
            width: 24px;
        }
        /*
         * ▼ / ▶ 自体は小さく表示
         */
        .CodeMirror-foldgutter-open,
        .CodeMirror-foldgutter-folded {
            width: 24px;
            min-width: 24px;
            position: relative;
            cursor: pointer;
        }
        .CodeMirror-foldgutter-open:after {
            content: "▼";
            position: absolute;
            left: 7px;
            top: 50%;
            transform: translateY(-50%);
            color: #5a5a5f;
            font-size: 8px;
        }
        .CodeMirror-foldgutter-folded:after {
            content: "▶";
            position: absolute;
            left: 7px;
            top: 50%;
            transform: translateY(-50%);
            color: #0A84FF;
            font-size: 8px;
        }
        .CodeMirror-foldmarker {
            color: #0A84FF;
            font-family: sans-serif;
            font-size: 8px;
            padding: 0 4px;
        }
    </style>
</head>
<body>
    <!-- =====================================================
         ツールバー
    ====================================================== -->
    <div id="toolbar">
        <div class="button-group">
            <button
                onclick="document.getElementById('file-input').click()">
                📂 開く
            </button>
            <button
                onclick="downloadFile()">
                💾 保存
            </button>
        </div>
        <input
            type="file"
            id="file-input"
            style="display:none;"
            onchange="loadFile(event)"
        >
        <div>
            <span id="file-name-display">
                新規ファイル
            </span>
        </div>
    </div>
    <!-- =====================================================
         エディタ
    ====================================================== -->
    <div id="editor-container"></div>
    <!-- =====================================================
         CodeMirror
    ====================================================== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <!-- モード -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/php/php.min.js"></script>
    <!-- 折り畳み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/brace-fold.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/xml-fold.min.js"></script>
    <script>
        /* =====================================================
           ファイル名
        ====================================================== */
        let currentFileName = 'untitled.js';
        /* =====================================================
           拡張子 → モード
        ====================================================== */
        const extensionToMode = {
            'js': 'javascript',
            'php': 'php',
            'html': 'htmlmixed',
            'css': 'css',
            'json': 'javascript',
            'txt': 'null'
        };
        /* =====================================================
           エディタ
        ====================================================== */
        const editor = CodeMirror(
            document.getElementById(
                'editor-container'
            ),
            {
                value:
                    "// ここにコードをペーストするか、ファイルを開いてください",
                mode: "javascript",
                theme: "custom",
                lineNumbers: true,
                /*
                 * 長いコードを横方向にも
                 * スクロールできるようにする。
                 */
                lineWrapping: false,
                /*
                 * iOS標準入力
                 */
                inputStyle: "contenteditable",
                spellcheck: false,
                /*
                 * 折り畳み
                 */
                foldGutter: true,
                gutters: [
                    "CodeMirror-linenumbers",
                    "CodeMirror-foldgutter"
                ]
            }
        );
        /* =====================================================
           ★ 折り畳みガターのタップ範囲を拡大
           
           ▼ / ▶ のある行全体をタップ対象にする。
           
           ただし通常のコード編集部分まで
           折り畳み操作にはしない。
        ====================================================== */
        editor.getWrapperElement()
            .addEventListener(
                "click",
                function(event) {
                    const target =
                        event.target;
                    /*
                     * 折り畳みガター内を
                     * タップした場合だけ処理
                     */
                    const gutter =
                        target.closest(
                            ".CodeMirror-foldgutter"
                        );
                    if (!gutter) {
                        return;
                    }
                    /*
                     * CodeMirror側の
                     * 標準処理を利用する。
                     */
                },
                true
            );
        /* =====================================================
           ★ 折り畳みガターの幅を
             実質的なタップ領域として確保
        ====================================================== */
        editor.getWrapperElement()
            .addEventListener(
                "touchstart",
                function(event) {
                    const target =
                        event.target;
                    const gutter =
                        target.closest(
                            ".CodeMirror-foldgutter"
                        );
                    if (!gutter) {
                        return;
                    }
                    /*
                     * ガターに触れたことを
                     * CodeMirrorへ伝える。
                     */
                    event.stopPropagation();
                },
                false
            );
        /* =====================================================
           ファイル読み込み
        ====================================================== */
        function loadFile(event) {
            const file =
                event.target.files[0];
            if (!file) {
                return;
            }
            const reader =
                new FileReader();
            reader.onload =
                function(e) {
                    /*
                     * コードをセット
                     */
                    editor.setValue(
                        e.target.result
                    );
                    /*
                     * ファイル名
                     */
                    currentFileName =
                        file.name;
                    document.getElementById(
                        'file-name-display'
                    ).textContent =
                        currentFileName;
                    /*
                     * 言語モード
                     */
                    const ext =
                        currentFileName
                            .split('.')
                            .pop()
                            .toLowerCase();
                    const mode =
                        extensionToMode[ext]
                        || 'null';
                    editor.setOption(
                        "mode",
                        mode
                    );
                    /*
                     * CodeMirrorの
                     * モード解析を待つ
                     */
                    setTimeout(
                        function() {
                            foldAll();
                            editor.refresh();
                        },
                        250
                    );
                };
            reader.readAsText(file);
            event.target.value = '';
        }
        /* =====================================================
           全て折り畳む
        ====================================================== */
        function foldAll() {
            editor.operation(
                function() {
                    for (
                        let i = 0;
                        i < editor.lineCount();
                        i++
                    ) {
                        editor.foldCode(
                            CodeMirror.Pos(
                                i,
                                0
                            ),
                            null,
                            "fold"
                        );
                    }
                }
            );
        }
        /* =====================================================
           保存
        ====================================================== */
        function downloadFile() {
            const code =
                editor.getValue();
            const blob =
                new Blob(
                    [code],
                    {
                        type: 'text/plain'
                    }
                );
            const url =
                URL.createObjectURL(blob);
            const a =
                document.createElement('a');
            a.href =
                url;
            a.download =
                currentFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            const nameDisplay =
                document.getElementById(
                    'file-name-display'
                );
            nameDisplay.style.color =
                '#0A84FF';
            setTimeout(
                function() {
                    nameDisplay.style.color =
                        '#ffffff';
                },
                1000
            );
        }
        /* =====================================================
           初期表示
        ====================================================== */
        setTimeout(
            function() {
                foldAll();
                editor.refresh();
            },
            250
        );
    </script>
</body>
</html>
