<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホ用・コードエディタ（カスタム版）</title>
    <style>
        /* 画像のiOSエディタ風の全体レイアウトと配色 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        
        /* ツールバー */
        #toolbar {
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000000;
            border-bottom: 1px solid #333;
            min-height: 44px;
            user-select: none; /* ツールバーの誤選択を防止 */
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
            background-color: transparent;
            color: #0A84FF;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
        button:active { background-color: rgba(10, 132, 255, 0.2); }
        
        #file-name-display {
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* エディタのコンテナ */
        #editor-container {
            flex-grow: 1;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- ツールバー -->
    <div id="toolbar">
        <div class="button-group">
            <button onclick="document.getElementById('file-input').click()">📂 開く</button>
            <button onclick="downloadFile()">💾 保存</button>
            <button onclick="copyText()">📋 コピー</button>
        </div>
        
        <input type="file" id="file-input" style="display: none;" onchange="loadFile(event)">

        <div>
            <span id="file-name-display">新規ファイル</span>
        </div>
    </div>

    <!-- エディタ -->
    <div id="editor-container"></div>

    <!-- Monaco Editorの読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});

        window.MonacoEnvironment = {
            getWorkerUrl: function(workerId, label) {
                return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
                    self.MonacoEnvironment = { baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/' };
                    importScripts('https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/base/worker/workerMain.js');
                `)}`;
            }
        };

        let editor;
        let currentFileName = 'untitled.js';

        const extensionToLanguage = {
            'js': 'javascript', 'php': 'php', 'html': 'html',
            'css': 'css', 'json': 'json', 'md': 'markdown', 'txt': 'plaintext'
        };

        require(['vs/editor/editor.main'], function() {
            
            // --- カスタムテーマ（前回と同じ配色） ---
            monaco.editor.defineTheme('my-custom-dark', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: '7a7a7a', fontStyle: 'italic' },
                    { token: 'string', foreground: 'c88251' },
                    { token: 'keyword', foreground: '569cd6' },
                    { token: 'variable.php', foreground: 'a381d6' },
                    { token: 'variable.predefined', foreground: 'a381d6' },
                    { token: 'constant', foreground: 'd16969' },
                    { token: 'number', foreground: 'b5cea8' },
                    { token: 'type', foreground: '4ec9b0' }
                ],
                colors: {
                    'editor.background': '#1a1a1c',
                    'editorGutter.background': '#1a1a1c',
                    'editorLineNumber.foreground': '#5a5a5f',
                    'editorIndentGuide.background': '#333333',
                    'editorWhitespace.foreground': '#404040'
                }
            });

            // エディタの生成
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '// ここにコードをペーストするか、ファイルを開いてください',
                language: 'javascript',
                theme: 'my-custom-dark',
                
                // ★ ご要望のカスタマイズ設定
                fontSize: 8,                    // 文字サイズを8pxに変更
                lineHeight: 14,                 // 8pxに合わせて行間を自動調整
                folding: true,                  // ▼での開閉（フォールディング）をオン
                showFoldingControls: 'always',  // 常に▼を表示する
                
                fontFamily: "Menlo, Monaco, 'Courier New', monospace",
                minimap: { enabled: false },
                renderWhitespace: 'all',
                wordWrap: 'on',
                lineNumbersMinChars: 3,
                scrollBeyondLastLine: false,
                contextmenu: true // 長押しでのコピペメニューを許可
            });
        });

        // ---------------------------------------------
        // ファイル操作・コピー機能
        // ---------------------------------------------

        // 1. ファイルを読み込む
        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                // エディタにテキストをセット
                editor.setValue(e.target.result);
                
                currentFileName = file.name;
                document.getElementById('file-name-display').textContent = currentFileName;

                // 拡張子から言語を自動判別
                const ext = currentFileName.split('.').pop().toLowerCase();
                const lang = extensionToLanguage[ext] || 'plaintext';
                monaco.editor.setModelLanguage(editor.getModel(), lang);

                // ★ ファイルを開いた初期状態で、すべて閉じる（折りたたむ）処理
                // 言語の解析が完了するのを少し（0.5秒）待ってから閉じるコマンドを実行します
                setTimeout(() => {
                    editor.getAction('editor.foldAll').run();
                }, 500);
            };
            
            reader.readAsText(file);
            event.target.value = '';
        }

        // 2. コピー機能
        async function copyText() {
            // エディタ上で現在選択されている範囲を取得
            const selection = editor.getSelection();
            const selectedText = editor.getModel().getValueInRange(selection);
            
            // 選択範囲があればその部分を、何も選択されていなければ全体のコードを対象にする
            const textToCopy = selectedText ? selectedText : editor.getValue();
            
            if (!textToCopy) return;

            try {
                // スマホのクリップボードにコピー
                await navigator.clipboard.writeText(textToCopy);
                alert(selectedText ? '選択範囲をコピーしました！' : 'ファイル全体をコピーしました！');
            } catch (err) {
                // 万が一クリップボードAPIがブロックされた場合の代替手段
                alert('コピー機能がブラウザに許可されていません。画面を長押しして手動でコピーしてください。');
            }
        }

        // 3. ファイルを保存する
        function downloadFile() {
            const code = editor.getValue();
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            const nameDisplay = document.getElementById('file-name-display');
            nameDisplay.style.color = '#0A84FF';
            setTimeout(() => { nameDisplay.style.color = '#ffffff'; }, 1000);
        }
    </script>
</body>
</html>
