<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホネイティブ・コードエディタ</title>
    
    <!-- CodeMirrorの基本CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.css">

    <style>
        /* 画面全体のレイアウト */
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            display: flex; flex-direction: column;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }
        
        /* ツールバー */
        #toolbar {
            padding: 8px 10px;
            display: flex; justify-content: space-between; align-items: center;
            background-color: #000000; border-bottom: 1px solid #333;
            min-height: 44px; user-select: none;
        }
        .button-group { display: flex; gap: 8px; }
        button {
            padding: 6px 10px; font-size: 14px; cursor: pointer;
            background-color: transparent; color: #0A84FF;
            border: none; border-radius: 4px; font-weight: bold;
        }
        button:active { background-color: rgba(10, 132, 255, 0.2); }
        #file-name-display {
            color: #ffffff; font-size: 12px; font-weight: bold;
            max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        #editor-container { flex-grow: 1; width: 100%; position: relative; }

        /* ★ エディタ全体の調整 ★ */
        .CodeMirror {
            height: 100%;
            font-family: Menlo, Monaco, "Courier New", monospace;
            /* iOSネイティブの選択を強制的に許可する */
            -webkit-user-select: auto !important; 
        }
        
        /* ★ カスタムテーマ（画像配色 + ご指定の8px文字） ★ */
        .cm-s-custom.CodeMirror {
            background-color: #1a1a1c;
            color: #d4d4d4;
            font-size: 8px;    /* ご要望の極小サイズ */
            line-height: 14px; /* 8pxに合わせた行間 */
        }
        .cm-s-custom .CodeMirror-gutters { background-color: #1a1a1c; border-right: none; }
        .cm-s-custom .CodeMirror-linenumber { color: #5a5a5f; }
        
        /* 構文の色分け設定 */
        .cm-s-custom .cm-comment { color: #7a7a7a; font-style: italic; }
        .cm-s-custom .cm-string { color: #c88251; }
        .cm-s-custom .cm-keyword { color: #569cd6; }
        .cm-s-custom .cm-variable-2 { color: #a381d6; }
        .cm-s-custom .cm-def { color: #569cd6; }
        .cm-s-custom .cm-number { color: #b5cea8; }
        .cm-s-custom .cm-tag { color: #569cd6; }
        .cm-s-custom .cm-attribute { color: #4ec9b0; }

        /* ★ 折りたたみ（▼）の見た目調整 ★ */
        .CodeMirror-foldmarker {
            color: #0A84FF; text-shadow: none; font-family: sans-serif; cursor: pointer;
            padding: 0 4px;
        }
        .CodeMirror-foldgutter-open:after { content: "▼"; color: #5a5a5f; font-size: 8px; }
        .CodeMirror-foldgutter-folded:after { content: "▶"; color: #0A84FF; font-size: 8px; }
    </style>
</head>
<body>
    <!-- ツールバー -->
    <div id="toolbar">
        <div class="button-group">
            <button onclick="document.getElementById('file-input').click()">📂 開く</button>
            <button onclick="downloadFile()">💾 保存</button>
            <button onclick="copyText()">📋 コピー</button>
        </div>
        <input type="file" id="file-input" style="display: none;" onchange="loadFile(event)">
        <div><span id="file-name-display">新規ファイル</span></div>
    </div>

    <!-- エディタ本体 -->
    <div id="editor-container"></div>

    <!-- CodeMirror のコアエンジン -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    
    <!-- 言語モード (PHP, JS, HTML, CSSなど) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/php/php.min.js"></script>

    <!-- ▼ 折りたたみ機能の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/brace-fold.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/xml-fold.min.js"></script>

    <script>
        let currentFileName = 'untitled.js';

        const extensionToMode = {
            'js': 'javascript', 'php': 'php', 'html': 'htmlmixed',
            'css': 'css', 'json': 'javascript', 'txt': 'null'
        };

        // エディタの初期化
        const editor = CodeMirror(document.getElementById('editor-container'), {
            value: "// ここにコードをペーストするか、ファイルを開いてください",
            mode: "javascript",
            theme: "custom",
            lineNumbers: true,
            lineWrapping: true, // スマホ幅で自動折り返し
            
            // ★ スマホのネイティブな操作感（メモアプリ感）を実現する魔法の設定 ★
            inputStyle: "contenteditable",
            spellcheck: false,

            // 折りたたみ（▼）機能の有効化
            foldGutter: true,
            gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"]
        });

        // 1. ファイルを開く処理
        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                // コードを流し込む
                editor.setValue(e.target.result);
                currentFileName = file.name;
                document.getElementById('file-name-display').textContent = currentFileName;

                // 言語切り替え
                const ext = currentFileName.split('.').pop().toLowerCase();
                const mode = extensionToMode[ext] || 'null';
                editor.setOption("mode", mode);

                // ★ ファイルを開いた直後に「全て折りたたむ」処理
                setTimeout(() => {
                    editor.operation(function() {
                        // 全ての行をチェックして、たためる場所(functionやタグ)を強制的に閉じる
                        for (var i = 0; i < editor.lineCount(); i++) {
                            editor.foldCode(CodeMirror.Pos(i, 0), null, "fold");
                        }
                    });
                }, 100); 
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // 2. コピー機能（選択時はその部分、未選択時は全体）
        async function copyText() {
            const selected = editor.getSelection();
            const text = selected ? selected : editor.getValue();
            if (!text) return;

            try {
                await navigator.clipboard.writeText(text);
                alert(selected ? '選択範囲をコピーしました！' : 'ファイル全体をコピーしました！');
            } catch (err) {
                alert('画面を長押ししてコピーしてください');
            }
        }

        // 3. 保存機能
        function downloadFile() {
            const code = editor.getValue();
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            const nameDisplay = document.getElementById('file-name-display');
            nameDisplay.style.color = '#0A84FF';
            setTimeout(() => { nameDisplay.style.color = '#ffffff'; }, 1000);
        }
    </script>
</body>
</html>
