<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>スマホコードエディター</title>


<!-- =====================================================
     CodeMirror
===================================================== -->

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.css">


<style>

/* =====================================================
   全体
===================================================== */

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #121212;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
}


/* =====================================================
   ツールバー
===================================================== */

#toolbar {

    height: 44px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 10px;

    box-sizing: border-box;

    background: #000;

    border-bottom: 1px solid #333;
}


#toolbar-left {

    display: flex;

    gap: 8px;
}


button {

    border: none;

    background: none;

    color: #0A84FF;

    font-size: 14px;

    font-weight: bold;

    padding: 6px 8px;
}


#file-name-display {

    max-width: 130px;

    color: #aaa;

    font-size: 12px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   エディター
===================================================== */

#editor-container {

    position: absolute;

    top: 44px;
    bottom: 0;
    left: 0;
    right: 0;

    overflow: hidden;
}


.CodeMirror {

    width: 100%;
    height: 100%;

    font-family:
        Menlo,
        Monaco,
        "Courier New",
        monospace;

    font-size: 8px;

    line-height: 14px;

    background: #1a1a1c;

    color: #d4d4d4;

    /*
     * iOSの選択操作を有効化
     */

    -webkit-user-select: text !important;
    user-select: text !important;

    -webkit-touch-callout: default;

    touch-action: manipulation;
}


.CodeMirror-scroll {

    overflow-x: auto !important;
    overflow-y: auto !important;

    -webkit-overflow-scrolling: touch;
}


/* =====================================================
   ガター
===================================================== */

.CodeMirror-gutters {

    background: #1a1a1c;

    border: none;
}


.CodeMirror-linenumber {

    color: #555;

    font-size: 8px;
}


.CodeMirror-foldgutter {

    width: 20px;
}


/* =====================================================
   折り畳み記号
===================================================== */

.CodeMirror-foldgutter-open,
.CodeMirror-foldgutter-folded {

    position: relative;

    width: 20px;

    cursor: pointer;
}


.CodeMirror-foldgutter-open:after {

    content: "▼";

    position: absolute;

    left: 5px;

    top: 50%;

    transform: translateY(-50%);

    color: #666;

    font-size: 7px;
}


.CodeMirror-foldgutter-folded:after {

    content: "▶";

    position: absolute;

    left: 5px;

    top: 50%;

    transform: translateY(-50%);

    color: #0A84FF;

    font-size: 7px;
}


/*
 * CodeMirror標準の「...」は使わない。
 * 行全体を操作対象にする。
 */

.CodeMirror-foldmarker {

    display: none;
}


/* =====================================================
   選択
===================================================== */

.CodeMirror-selected {

    background: rgba(10, 132, 255, 0.25) !important;
}


/* =====================================================
   構文色
===================================================== */

.cm-s-default .cm-comment {

    color: #777;
}


.cm-s-default .cm-string {

    color: #c88251;
}


.cm-s-default .cm-keyword {

    color: #569cd6;
}


.cm-s-default .cm-def {

    color: #569cd6;
}


.cm-s-default .cm-number {

    color: #b5cea8;
}


.cm-s-default .cm-variable-2 {

    color: #a381d6;
}


.cm-s-default .cm-tag {

    color: #569cd6;
}


.cm-s-default .cm-attribute {

    color: #4ec9b0;
}

</style>

</head>


<body>


<!-- =====================================================
     ツールバー
===================================================== -->

<div id="toolbar">

    <div id="toolbar-left">

        <button
            onclick="document.getElementById('file-input').click()">
            開く
        </button>

        <button
            onclick="downloadFile()">
            保存
        </button>

    </div>


    <input
        type="file"
        id="file-input"
        style="display:none;"
        onchange="loadFile(event)"
    >


    <div id="file-name-display">
        新規ファイル
    </div>

</div>


<!-- =====================================================
     エディター
===================================================== -->

<div id="editor-container"></div>


<!-- =====================================================
     CodeMirror
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/xml/xml.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/css/css.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/htmlmixed/htmlmixed.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/clike/clike.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/php/php.min.js"></script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/foldgutter.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/brace-fold.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/fold/xml-fold.min.js"></script>


<script>


/* =====================================================
   ファイル
===================================================== */

let currentFileName = "untitled.js";


/* =====================================================
   CodeMirror
===================================================== */

const editor = CodeMirror(

    document.getElementById("editor-container"),

    {

        value:
            "// ここにコードを入力してください",

        mode: "javascript",

        lineNumbers: true,

        lineWrapping: false,

        /*
         * iOS標準の入力・選択に近づける
         */

        inputStyle: "contenteditable",

        spellcheck: false,

        /*
         * 折り畳みガターは表示するが、
         * 実際の階層管理は下で行う。
         */

        foldGutter: true,

        gutters: [

            "CodeMirror-linenumbers",

            "CodeMirror-foldgutter"

        ]

    }

);


/* =====================================================
   ★ 起動時は編集禁止
===================================================== */

let editMode = false;

editor.setOption(
    "readOnly",
    true
);


/* =====================================================
   ★ ダブルタップで編集モード
===================================================== */

editor.getWrapperElement()
    .addEventListener(
        "dblclick",
        function() {

            editMode = true;

            editor.setOption(
                "readOnly",
                false
            );

            editor.focus();

        }
    );


/* =====================================================
   ★ 折り畳み管理
===================================================== */

let foldLevels = [];


/*
 * 1つの折り畳みを
 *
 * {
 *     from: 開始行,
 *     to: 終了行,
 *     level: 階層
 * }
 *
 * として管理する。
 */


/* =====================================================
   行のインデント
===================================================== */

function getIndent(line) {

    const match =
        line.match(/^[ \t]*/);

    if (!match) {

        return 0;
    }


    let indent = 0;

    const text = match[0];

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        if (text[i] === "\t") {

            indent += 4;

        } else {

            indent += 1;

        }

    }

    return indent;

}


/* =====================================================
   ブロック開始判定
===================================================== */

function isBlockStart(line) {

    const text =
        line.trim();


    if (!text) {

        return false;
    }


    /*
     * JavaScript
     */

    if (
        text.match(
            /^(function|if|else|for|while|switch|try|catch|finally|class)\b/
        )
    ) {

        return true;
    }


    /*
     * { で終わる行
     */

    if (
        text.endsWith("{")
    ) {

        return true;
    }


    /*
     * HTML
     */

    if (
        text.match(
            /^<([a-zA-Z][\w-]*)(?:\s[^>]*)?>$/
        )
    ) {

        return true;
    }


    return false;

}


/* =====================================================
   対応する終了行を探す
===================================================== */

function findBlockEnd(startLine) {

    const total =
        editor.lineCount();


    const startText =
        editor.getLine(startLine);


    const startIndent =
        getIndent(startText);


    /*
     * { } ブロック
     */

    let braceCount = 0;

    let hasBrace = false;


    for (
        let i = startLine;
        i < total;
        i++
    ) {

        const line =
            editor.getLine(i);


        for (
            let j = 0;
            j < line.length;
            j++
        ) {

            if (
                line[j] === "{"
            ) {

                braceCount++;

                hasBrace = true;

            }

            else if (
                line[j] === "}"
            ) {

                braceCount--;

            }

        }


        if (
            hasBrace &&
            braceCount === 0 &&
            i > startLine
        ) {

            return i;
        }

    }


    /*
     * インデント式ブロック
     */

    for (
        let i = startLine + 1;
        i < total;
        i++
    ) {

        const line =
            editor.getLine(i);


        if (!line.trim()) {

            continue;
        }


        if (
            getIndent(line) <= startIndent
        ) {

            return i - 1;
        }

    }


    return null;

}


/* =====================================================
   全階層を解析
===================================================== */

function analyzeFoldLevels() {

    foldLevels = [];


    const total =
        editor.lineCount();


    for (
        let i = 0;
        i < total;
        i++
    ) {

        const line =
            editor.getLine(i);


        if (
            !isBlockStart(line)
        ) {

            continue;
        }


        const end =
            findBlockEnd(i);


        if (
            end === null ||
            end <= i
        ) {

            continue;
        }


        const indent =
            getIndent(line);


        foldLevels.push({

            from: i,

            to: end,

            indent: indent

        });

    }

}


/* =====================================================
   最上位階層だけ取得
===================================================== */

function getTopLevelFolds() {

    const result = [];


    foldLevels.forEach(
        function(fold) {

            let nested = false;


            foldLevels.forEach(
                function(parent) {

                    if (
                        parent === fold
                    ) {

                        return;
                    }


                    if (
                        parent.from < fold.from &&
                        parent.to >= fold.to &&
                        parent.indent < fold.indent
                    ) {

                        nested = true;

                    }

                }
            );


            if (!nested) {

                result.push(fold);

            }

        }
    );


    return result;

}


/* =====================================================
   指定行の次の階層
===================================================== */

function getNextLevelFolds(parent) {

    const children =
        foldLevels.filter(
            function(fold) {

                return (
                    fold.from > parent.from &&
                    fold.to <= parent.to &&
                    fold.indent > parent.indent
                );

            }
        );


    let minIndent =
        Infinity;


    children.forEach(
        function(fold) {

            if (
                fold.indent < minIndent
            ) {

                minIndent =
                    fold.indent;

            }

        }
    );


    return children.filter(
        function(fold) {

            return (
                fold.indent === minIndent
            );

        }
    );

}


/* =====================================================
   1段目を折り畳む
===================================================== */

function foldFirstLevel() {

    analyzeFoldLevels();


    const roots =
        getTopLevelFolds();


    editor.operation(
        function() {

            /*
             * 後ろから処理
             */

            roots
                .sort(
                    function(a, b) {

                        return b.from - a.from;

                    }
                )
                .forEach(
                    function(fold) {

                        editor.foldCode(
                            CodeMirror.Pos(
                                fold.from,
                                0
                            ),
                            null,
                            "fold"
                        );

                    }
                );

        }
    );

}


/* =====================================================
   指定した親の中を
   1階層だけ展開
===================================================== */

function unfoldOneLevel(parent) {

    const children =
        getNextLevelFolds(parent);


    children
        .sort(
            function(a, b) {

                return b.from - a.from;

            }
        )
        .forEach(
            function(child) {

                editor.unfold(
                    CodeMirror.Pos(
                        child.from,
                        0
                    )
                );

            }
        );

}


/* =====================================================
   折り畳み中の行を取得
===================================================== */

function getFoldAtLine(line) {

    const marks =
        editor.findMarksAt(
            CodeMirror.Pos(line, 0)
        );


    for (
        let i = 0;
        i < marks.length;
        i++
    ) {

        if (
            marks[i].collapsed
        ) {

            return marks[i];

        }

    }


    return null;

}


/* =====================================================
   ★ 折り畳まれている行をタップ
===================================================== */

editor.getWrapperElement()
    .addEventListener(
        "click",
        function(event) {

            /*
             * 編集モードなら
             * 通常のCodeMirror操作を優先
             */

            if (editMode) {

                return;
            }


            const lineElement =
                event.target.closest(
                    ".CodeMirror-line"
                );


            if (!lineElement) {

                return;
            }


            const lineNumber =
                parseInt(
                    lineElement
                        .getAttribute(
                            "data-line"
                        ),
                    10
                );


            if (
                isNaN(lineNumber)
            ) {

                return;
            }


            const mark =
                getFoldAtLine(
                    lineNumber
                );


            if (!mark) {

                return;
            }


            /*
             * この行の折り畳みを
             * まず開く
             */

            editor.unfold(
                CodeMirror.Pos(
                    lineNumber,
                    0
                )
            );


            /*
             * 次の階層は
             * そのまま折り畳んでおく。
             *
             * つまり
             *
             * function
             *   ↓
             * if
             *   ↓
             * for
             *
             * と1段ずつ見える。
             */

            analyzeFoldLevels();

        },
        false
    );


/* =====================================================
   行DOMに行番号を付与
===================================================== */

editor.on(
    "renderLine",
    function(cm, line, element) {

        element.setAttribute(
            "data-line",
            cm.getLineNumber(line)
        );

    }
);


/* =====================================================
   ファイル読み込み
===================================================== */

function loadFile(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            editor.setValue(
                e.target.result
            );


            currentFileName =
                file.name;


            document.getElementById(
                "file-name-display"
            ).textContent =
                currentFileName;


            const ext =
                currentFileName
                    .split(".")
                    .pop()
                    .toLowerCase();


            let mode =
                "javascript";


            if (ext === "html") {

                mode = "htmlmixed";

            }

            else if (ext === "css") {

                mode = "css";

            }

            else if (ext === "php") {

                mode = "php";

            }

            else if (ext === "json") {

                mode = "javascript";

            }


            editor.setOption(
                "mode",
                mode
            );


            /*
             * 読み込み直後は
             * 編集モードに戻さない
             */

            editMode = false;

            editor.setOption(
                "readOnly",
                true
            );


            setTimeout(
                function() {

                    editor.refresh();

                    foldFirstLevel();

                },
                300
            );

        };


    reader.readAsText(file);


    event.target.value = "";

}


/* =====================================================
   保存
===================================================== */

function downloadFile() {

    const code =
        editor.getValue();


    const blob =
        new Blob(
            [code],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href =
        url;


    a.download =
        currentFileName;


    document.body.appendChild(a);


    a.click();


    document.body.removeChild(a);


    URL.revokeObjectURL(url);

}


/* =====================================================
   初期処理
===================================================== */

setTimeout(
    function() {

        editor.refresh();

        foldFirstLevel();

    },
    300
);


</script>

</body>

</html>
