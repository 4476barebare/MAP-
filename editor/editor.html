<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- ★スマホ特化：勝手なズームを禁止し、アプリのように画面を固定する -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホ用・コードエディタ</title>
    <style>
        /* 画像のiOSエディタ風の全体レイアウトと配色 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* スマホ特有の余分なスクロールを防止 */
        }
        
        /* ツールバー（スマホで押しやすいよう高さを少し確保） */
        #toolbar {
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000000;
            border-bottom: 1px solid #333;
            min-height: 44px; /* iOSの標準的なタップ領域 */
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        /* iOS風の青いテキストボタン */
        button {
            padding: 8px 12px;
            font-size: 12px; /* スマホで押しやすいサイズ */
            cursor: pointer;
            background-color: transparent;
            color: #0A84FF;
            border: none;
            border-radius: 4px;
            font-weight: 500;
        }
        button:active { background-color: rgba(10, 132, 255, 0.2); }
        
        /* ファイル名の表示部分 */
        #file-name-display {
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* エディタのコンテナ */
        #editor-container {
            flex-grow: 1;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- ツールバー -->
    <div id="toolbar">
        <div class="button-group">
            <button onclick="document.getElementById('file-input').click()">📂 開く</button>
            <button onclick="downloadFile()">💾 保存</button>
        </div>
        
        <!-- ★スマホ標準のファイル選択を呼び出すための隠し要素 -->
        <input type="file" id="file-input" style="display: none;" onchange="loadFile(event)">

        <div>
            <span id="file-name-display">新規ファイル</span>
        </div>
    </div>

    <!-- エディタ -->
    <div id="editor-container"></div>

    <!-- Monaco Editorの読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});

        window.MonacoEnvironment = {
            getWorkerUrl: function(workerId, label) {
                return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
                    self.MonacoEnvironment = { baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/' };
                    importScripts('https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/base/worker/workerMain.js');
                `)}`;
            }
        };

        let editor;
        let currentFileName = 'untitled.js';

        const extensionToLanguage = {
            'js': 'javascript', 'php': 'php', 'html': 'html',
            'css': 'css', 'json': 'json', 'md': 'markdown', 'txt': 'plaintext'
        };

        require(['vs/editor/editor.main'], function() {
            
            // --- カスタムテーマ（画像配色） ---
            monaco.editor.defineTheme('my-custom-dark', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'comment', foreground: '7a7a7a', fontStyle: 'italic' },
                    { token: 'string', foreground: 'c88251' },
                    { token: 'keyword', foreground: '569cd6' },
                    { token: 'variable.php', foreground: 'a381d6' },
                    { token: 'variable.predefined', foreground: 'a381d6' },
                    { token: 'constant', foreground: 'd16969' },
                    { token: 'number', foreground: 'b5cea8' },
                    { token: 'type', foreground: '4ec9b0' }
                ],
                colors: {
                    'editor.background': '#1a1a1c',
                    'editorGutter.background': '#1a1a1c',
                    'editorLineNumber.foreground': '#5a5a5f',
                    'editorIndentGuide.background': '#333333',
                    'editorWhitespace.foreground': '#404040'
                }
            });

            // ★スマホ向けに調整したエディタの生成
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '// ここにコードをペーストするか、ファイルを開いてください',
                language: 'javascript',
                theme: 'my-custom-dark',
                fontSize: 14, // スマホに合わせて少し小さく
                fontFamily: "Menlo, Monaco, 'Courier New', monospace",
                lineHeight: 22,
                minimap: { enabled: false },
                renderWhitespace: 'all',
                wordWrap: 'on', // ★画面幅で自動折り返し（スマホで横スクロールを防ぐ）
                lineNumbersMinChars: 3, // 行番号の余白を詰める
                folding: false, // 折りたたみ機能をオフにしてスッキリさせる
                scrollBeyondLastLine: false
            });
        });

        // ---------------------------------------------
        // スマホ向けファイル操作
        // ---------------------------------------------

        // 1. ファイルを読み込む（FileReader API）
        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                // エディタにテキストをセット
                editor.setValue(e.target.result);
                
                // ファイル名を更新
                currentFileName = file.name;
                document.getElementById('file-name-display').textContent = currentFileName;

                // 拡張子から言語を自動判別
                const ext = currentFileName.split('.').pop().toLowerCase();
                const lang = extensionToLanguage[ext] || 'plaintext';
                monaco.editor.setModelLanguage(editor.getModel(), lang);
            };
            
            // ファイルをテキストとして読み込む
            reader.readAsText(file);
            
            // 同じファイルを再度選べるようにリセット
            event.target.value = '';
        }

        // 2. ファイルをダウンロード形式で保存する
        function downloadFile() {
            const code = editor.getValue();
            
            // 文字列をファイル（Blob）に変換
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            // ダウンロード用のリンクを裏側で作ってクリックさせる
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            // 保存成功エフェクト
            const nameDisplay = document.getElementById('file-name-display');
            nameDisplay.style.color = '#0A84FF';
            setTimeout(() => { nameDisplay.style.color = '#ffffff'; }, 1000);
        }
    </script>
</body>
</html>
