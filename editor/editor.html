<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>スマホ特化型コードエディタUIプロトタイプ</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>

  <!-- メインヘッダー -->
  <header id="main-header">
    <button class="icon-btn" id="btn-menu">＝</button>
    <div class="file-title">index.html</div>
    <div class="header-actions">
      <button class="text-btn">ロード</button>
      <button class="text-btn">出力</button>
    </div>
  </header>

  <!-- サブヘッダー（✖️ボタンを削除） -->
  <div id="sub-header" class="hidden">
    <button class="icon-btn" id="btn-undo">↩️</button>
    <button class="icon-btn" id="btn-redo">↪️</button>
    <div class="spacer"></div>
    <button class="icon-btn" id="btn-left">←</button>
    <button class="icon-btn" id="btn-right">→</button>
    <!-- キーボード側の閉じるUIを使うため、自前の✖️は不要 -->
  </div>

  <!-- ドリルダウン用メニュー -->
  <nav id="drawer-menu">
    <div class="drawer-header">
      <button class="icon-btn" id="btn-back">＜</button>
      <div class="breadcrumb">全体 &gt; main-content</div>
    </div>
    <ul class="element-list">
      <li class="element-item" data-target="block1"><span class="tag">div</span> .header-section</li>
      <li class="element-item" data-target="block2"><span class="tag">div</span> .main-content</li>
      <li class="element-item" data-target="block3"><span class="tag">function</span> init()</li>
    </ul>
    <button class="add-btn">＋ 子要素を追加</button>
  </nav>

  <!-- メイン編集エリア -->
  <main id="editor-area">
    <div class="code-block" id="block1">
      <span class="tag">&lt;div class="header-section"&gt;</span><br>
      &nbsp;&nbsp;&lt;h1&gt;スマホエディタの世界へようこそ&lt;/h1&gt;<br>
      <span class="tag">&lt;/div&gt;</span>
    </div>
    
    <div class="code-block" id="block2">
      <span class="tag">&lt;div class="main-content"&gt;</span><br>
      &nbsp;&nbsp;&lt;p&gt;ここをタップして、下のチャット欄で編集します。&lt;/p&gt;<br>
      &nbsp;&nbsp;&lt;p&gt;タグだけ色が付くシンプルなUIです。&lt;/p&gt;<br>
      <span class="tag">&lt;/div&gt;</span>
    </div>

    <div class="code-block" id="block3">
      <span class="tag">function init() {</span><br>
      &nbsp;&nbsp;console.log("Started");<br>
      <span class="tag">}</span>
    </div>
  </main>

  <!-- チャット風入力欄（復活＆邪魔なバー抑制策を追加） -->
  <!-- チャット風入力欄（OSのお節介を極限まで無効化するハック版） -->
  <div id="chat-input-area">
    <textarea id="chat-textarea" placeholder="テキストを編集・追記..."
              name="dummy-random-string-xyz" 
              autocomplete="nope" 
              autocorrect="off" 
              autocapitalize="none" 
              spellcheck="false" 
              inputmode="text"
              data-lpignore="true" 
              data-1p-ignore></textarea>
    <button id="btn-send">↑</button>
  </div>


  <script src="editor.js"></script>
</body>
</html>
