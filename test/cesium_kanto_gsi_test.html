<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>関東 3D Terrain + GSI 空中写真</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css">
<style>
html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden}
#status{
 position:absolute;z-index:10;top:10px;left:10px;
 padding:10px 14px;background:rgba(0,0,0,.78);color:white;
 border-radius:6px;font:14px/1.5 sans-serif;
}
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="status">読み込み中...</div>

<script type="module">
Cesium.Ion.defaultAccessToken = "ここにCesium ionのTokenを入力";

try {
    // Cesium公式Quickstartと同じWorld Terrain設定
    const viewer = new Cesium.Viewer("cesiumContainer", {
        terrain: Cesium.Terrain.fromWorldTerrain(),
        animation: false,
        timeline: false,
        baseLayerPicker: false,
        geocoder: false,
        navigationHelpButton: false,
        fullscreenButton: true
    });

    // GSI 全国最新写真（シームレス）
    const gsi = new Cesium.UrlTemplateImageryProvider({
        url: "https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg",
        minimumLevel: 14,
        maximumLevel: 18,
        credit: new Cesium.Credit("出典：国土地理院")
    });

    viewer.imageryLayers.addImageryProvider(gsi);

    // 関東を斜め上から表示
    viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(
            139.35, 36.05, 260000
        ),
        orientation: {
            heading: Cesium.Math.toRadians(0),
            pitch: Cesium.Math.toRadians(-55),
            roll: 0
        },
        duration: 2
    });

    viewer.scene.globe.enableLighting = true;
    viewer.scene.globe.depthTestAgainstTerrain = true;

    document.getElementById("status").innerHTML =
        "World Terrain + GSI空中写真<br>出典：国土地理院";

} catch (error) {
    console.error(error);
    document.getElementById("status").textContent =
        "読み込みエラー: " + (error.message || error);
}
</script>
</body>
</html>
